<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071315">
<title>FTS QR Poster</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--accent:#d9b56d;--bg1:#071315;--bg2:#10383a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071315;color:#fff}body{display:grid;place-items:center;padding:14px}.wrap{width:100%;display:grid;place-items:center}.loading{padding:60px 20px;text-align:center;color:#a8b6b4}
.poster{position:relative;width:min(720px,calc(100vw - 28px));aspect-ratio:4/5;border-radius:34px;background:linear-gradient(145deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7%;overflow:hidden;box-shadow:0 30px 90px #0009}.poster>*{position:relative;z-index:4}.flyer{position:absolute!important;z-index:0!important;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute!important;z-index:1!important;inset:0;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.18) 30%,rgba(0,0,0,.58))}.glow{position:absolute!important;z-index:2!important;border-radius:50%;filter:blur(50px);opacity:.26}.glow.one{width:48%;aspect-ratio:1;background:var(--accent);left:-15%;top:-12%}.glow.two{width:42%;aspect-ratio:1;background:var(--accent);right:-18%;bottom:-12%}
.logo{position:absolute!important;z-index:5!important;right:5%;top:5%;max-width:24%;max-height:11%;object-fit:contain;filter:drop-shadow(0 6px 12px #0009)}.deco{position:absolute!important;z-index:3!important;font-size:clamp(3rem,10vw,6.4rem);filter:drop-shadow(0 10px 15px #0006);opacity:.9}.deco.a{left:-3%;top:4%;transform:rotate(-12deg)}.deco.b{right:-3%;bottom:4%;transform:rotate(12deg)}
.brand{font-size:clamp(.64rem,1.8vw,.9rem);letter-spacing:.2em;color:var(--accent);font-weight:900;text-shadow:0 2px 8px #000}.poster h1{font-size:clamp(2.4rem,8vw,5rem);line-height:.92;text-align:center;margin:14px 0 6px;text-shadow:0 4px 18px #000}.sub{font-size:clamp(1rem,3vw,1.55rem);color:var(--accent);font-weight:900;text-align:center;text-shadow:0 2px 10px #000}
.qrbox{width:55%;aspect-ratio:1;background:#fff;border-radius:26px;padding:6%;margin:7% 0 4%;box-shadow:0 16px 38px #0007}.qrbox>div,.qrbox img,.qrbox canvas{width:100%!important;height:100%!important}.cta{font-size:clamp(1rem,3vw,1.5rem);font-weight:900;text-align:center;text-shadow:0 2px 8px #000}.foot{font-size:.82rem;color:#e2e8e6;margin-top:3%;text-shadow:0 2px 8px #000}.code{position:absolute!important;bottom:2.5%;font-size:.62rem;letter-spacing:.14em;color:#d5dfdcaa}
.controls{width:min(720px,calc(100vw - 28px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.controls button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:900;background:var(--accent);color:#102020;cursor:pointer}.controls .secondary{background:#14383a;color:#fff;border:1px solid rgba(255,255,255,.1)}
.displayMode body,.displayMode{background:#000}.displayMode body{padding:0}.displayMode .controls{display:none!important}.displayMode .poster{height:100svh;width:auto;max-width:100vw;border-radius:0;box-shadow:none}
:fullscreen .controls{display:none}:fullscreen body{padding:0}:fullscreen .poster{height:100svh;width:auto;max-width:100vw;border-radius:0;box-shadow:none}
@media print{@page{size:A4 portrait;margin:0}body{padding:0;background:#fff}.controls{display:none!important}.poster{width:210mm;height:297mm;aspect-ratio:auto;border-radius:0;box-shadow:none}.qrbox{width:58%}}
@media(max-width:540px){body{padding:8px}.poster{border-radius:24px}.controls{width:calc(100% - 16px)}.controls button{font-size:.78rem;padding:10px 11px}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="loading">QR-Event wird geladen …</div></div>
<script src="./config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const cfg=window.FTS_CONFIG,params=new URLSearchParams(location.search),ref=params.get('e')||cfg.defaultEventToken,display=params.get('display')==='1';
const headers={'apikey':cfg.publishableKey,'Authorization':'Bearer '+cfg.publishableKey,'Content-Type':'application/json'};
async function rpc(name,body){const r=await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${name}`,{method:'POST',headers,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/')}
function assetUrl(path){if(!path)return'';return `${cfg.supabaseUrl}/storage/v1/object/public/${encodeURIComponent(cfg.liveBucket)}/${encodePath(path)}`}
function motifFor(ev){if(ev.motif)return ev.motif;return ({standard:'✦',autumn:'🎃',halloween:'👻',streetfood:'🍔',cars:'🏎️',neon:'✦',winter:'❄',spring:'🌸',summer:'☀️',wedding:'♥',sports:'⚽',business:'◆',festival:'🎪',carnival:'🎭'})[ev.theme||'standard']||'✦'}
async function boot(){
 try{
  const data=await rpc('fts_get_event',{p_event_token:ref});if(!data?.length)throw new Error('Event nicht aktiv');
  const ev=data[0],motif=motifFor(ev);
  document.documentElement.style.setProperty('--accent',ev.accent||'#d9b56d');document.documentElement.style.setProperty('--bg1',ev.bg1||'#071315');document.documentElement.style.setProperty('--bg2',ev.bg2||'#10383a');
  const root=document.getElementById('root');
  root.innerHTML=`<section class="poster" id="poster">
    ${ev.poster_bg_path?`<img class="flyer" crossorigin="anonymous" src="${assetUrl(ev.poster_bg_path)}">`:''}
    <div class="shade"></div><div class="glow one"></div><div class="glow two"></div>
    ${ev.logo_path?`<img class="logo" crossorigin="anonymous" src="${assetUrl(ev.logo_path)}">`:''}
    <div class="deco a">${esc(motif)}</div><div class="deco b">${esc(motif)}</div>
    <div class="brand">FTS.LU · SELFIE EVENT</div><h1>${esc(ev.title)}</h1><div class="sub">${esc(ev.subtitle||'')}</div>
    <div class="qrbox"><div id="qr"></div></div><div class="cta">Scannen & Selfie hochladen</div><div class="foot">FTS.lu · Eventfotografie</div>
    ${ev.short_code?`<div class="code">${esc(ev.short_code)}</div>`:''}
  </section>
  <div class="controls" id="controls"><button id="full">Vollbild / Anzeige</button><button id="png">PNG herunterladen</button><button id="print" class="secondary">Drucken</button></div>`;
  const guest=cfg.baseUrl+'?e='+encodeURIComponent(ev.short_code||ref);
  new QRCode(document.getElementById('qr'),{text:guest,width:700,height:700,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  document.getElementById('full').onclick=enterDisplay;document.getElementById('png').onclick=downloadPng;document.getElementById('print').onclick=()=>window.print();
  if(display){document.documentElement.classList.add('displayMode');setTimeout(()=>document.documentElement.requestFullscreen?.().catch(()=>{}),250)}
 }catch(e){console.error(e);document.getElementById('root').innerHTML='<div class="loading"><h2>Event konnte nicht geladen werden.</h2><p>Bitte prüfe den Event-Link.</p></div>'}
}
async function enterDisplay(){document.documentElement.classList.add('displayMode');try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{}}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&params.get('display')!=='1')document.documentElement.classList.remove('displayMode')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement)document.documentElement.classList.remove('displayMode')});
async function downloadPng(){const poster=document.getElementById('poster');if(!poster)return;const controls=document.getElementById('controls');if(controls)controls.style.display='none';try{await document.fonts?.ready;const c=await html2canvas(poster,{scale:2.5,backgroundColor:null,useCORS:true,allowTaint:false});const a=document.createElement('a');a.download='FTS-'+String(ref).replace(/[^a-z0-9_-]/gi,'-')+'-QR-Poster.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()}finally{if(controls&&!document.documentElement.classList.contains('displayMode'))controls.style.display='flex'}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});boot();
</script>
</body>
</html>
