<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071315">
<title>FTS QR Poster · V3 Print</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--accent:#d9b56d;--bg1:#071315;--bg2:#10383a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071315;color:#fff}body{display:grid;place-items:center;padding:14px}.wrap{width:100%;display:grid;place-items:center}.loading{padding:60px 20px;text-align:center;color:#a8b6b4}
.poster{position:relative;width:min(720px,calc(100vw - 28px));aspect-ratio:4/5;border-radius:34px;background:linear-gradient(145deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7%;overflow:hidden;box-shadow:0 30px 90px #0009}.poster>*{position:relative;z-index:4}.flyer{position:absolute!important;z-index:0!important;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute!important;z-index:1!important;inset:0;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.18) 30%,rgba(0,0,0,.58))}.glow{position:absolute!important;z-index:2!important;border-radius:50%;filter:blur(70px);opacity:.18}.poster.hasFlyer .glow{display:none!important}.poster.hasFlyer .shade{background:linear-gradient(rgba(0,0,0,.10),rgba(0,0,0,.02) 34%,rgba(0,0,0,.18))}.glow.one{width:48%;aspect-ratio:1;background:var(--accent);left:-15%;top:-12%}.glow.two{width:42%;aspect-ratio:1;background:var(--accent);right:-18%;bottom:-12%}
.logoStack{position:absolute!important;z-index:6!important;display:flex;gap:10px;align-items:center;max-width:72%;flex-wrap:wrap}
.logoStack img{object-fit:contain;filter:drop-shadow(0 6px 12px #0009)}
.logoStack img.small{max-width:85px;max-height:55px}.logoStack img.medium{max-width:125px;max-height:80px}.logoStack img.large{max-width:175px;max-height:110px}
.logoStack.pos-top-left{left:5%;top:5%}.logoStack.pos-top-center{left:50%;top:5%;transform:translateX(-50%);justify-content:center}.logoStack.pos-top-right{right:5%;top:5%;justify-content:flex-end}
.logoStack.pos-middle-left{left:5%;top:50%;transform:translateY(-50%)}.logoStack.pos-middle-center{left:50%;top:50%;transform:translate(-50%,-50%);justify-content:center}.logoStack.pos-middle-right{right:5%;top:50%;transform:translateY(-50%);justify-content:flex-end}
.logoStack.pos-bottom-left{left:5%;bottom:5%}.logoStack.pos-bottom-center{left:50%;bottom:5%;transform:translateX(-50%);justify-content:center}.logoStack.pos-bottom-right{right:5%;bottom:5%;justify-content:flex-end}.deco{position:absolute!important;z-index:3!important;font-size:clamp(3rem,10vw,6.4rem);filter:drop-shadow(0 10px 15px #0006);opacity:.9}.deco.a{left:-3%;top:4%;transform:rotate(-12deg)}.deco.b{right:-3%;bottom:4%;transform:rotate(12deg)}
.brand{font-size:clamp(.64rem,1.8vw,.9rem);letter-spacing:.2em;color:var(--accent);font-weight:900;text-shadow:0 2px 8px #000}.poster h1{font-size:clamp(2.4rem,8vw,5rem);line-height:.92;text-align:center;margin:14px 0 6px;text-shadow:0 4px 18px #000}.sub{font-size:clamp(1rem,3vw,1.55rem);color:var(--accent);font-weight:900;text-align:center;text-shadow:0 2px 10px #000}
.qrbox{width:55%;aspect-ratio:1;background:#fff;border-radius:26px;padding:6%;margin:7% 0 4%;box-shadow:0 16px 38px #0007;display:grid;place-items:center}.qrbox #qr{width:100%;height:100%;display:grid;place-items:center}.qrbox>div,.qrbox img,.qrbox canvas{width:100%!important;height:100%!important}.cta{font-size:clamp(1rem,3vw,1.5rem);font-weight:900;text-align:center;text-shadow:0 2px 8px #000}.foot{font-size:.82rem;color:#e2e8e6;margin-top:3%;text-shadow:0 2px 8px #000}.code{position:absolute!important;bottom:2.5%;font-size:.62rem;letter-spacing:.14em;color:#d5dfdcaa}
.controls{width:min(720px,calc(100vw - 28px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.controls button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:900;background:var(--accent);color:#102020;cursor:pointer}.controls .secondary{background:#14383a;color:#fff;border:1px solid rgba(255,255,255,.1)}
.screenAd{display:none;width:min(720px,calc(100vw - 28px));margin-top:10px;position:relative;z-index:20}.screenAd.show{display:block}.screenAdLabel{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:#829592;margin:0 0 4px 3px}.screenAd a{display:block;border-radius:12px;overflow:hidden;background:#02090a;border:1px solid rgba(255,255,255,.09)}.screenAd img{display:block;width:100%;aspect-ratio:4/1;object-fit:cover}.displayMode .screenAd,:fullscreen .screenAd{width:min(100vw,64svh);margin-top:5px}.displayMode.hasScreenAds .poster,.hasScreenAds:fullscreen .poster{width:min(100vw,64svh)!important}.displayMode .screenAdLabel,:fullscreen .screenAdLabel{display:none}.displayMode .screenAd a,:fullscreen .screenAd a{border-radius:0;border:0}
.displayMode,.displayMode body{background:#000}.displayMode body{padding:0;overflow:hidden;display:grid;place-items:center}.displayMode .wrap{width:100vw;min-height:100svh}.displayMode .controls{display:none!important}.displayMode .poster{width:min(100vw,80svh);height:auto;aspect-ratio:4/5;max-width:none;max-height:100svh;border-radius:0;box-shadow:none}
:fullscreen .controls{display:none!important}:fullscreen body{padding:0;overflow:hidden;display:grid;place-items:center}:fullscreen .wrap{width:100vw;min-height:100svh}:fullscreen .poster{width:min(100vw,80svh);height:auto;aspect-ratio:4/5;max-width:none;max-height:100svh;border-radius:0;box-shadow:none}
.exporting .poster{border-radius:0!important;box-shadow:none!important}
.printSheet{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{width:210mm;height:297mm;margin:0!important;padding:0!important;background:#fff!important}
  body>*{display:none!important}
  .screenAd{display:none!important}
  .printSheet{display:flex!important;position:fixed!important;inset:0!important;width:210mm!important;height:297mm!important;align-items:center!important;justify-content:center!important;background:#fff!important;z-index:999999!important}
  .printSheet img{display:block!important;width:210mm!important;height:auto!important;max-height:297mm!important;object-fit:contain!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
@media(max-width:540px){body{padding:8px}.poster{border-radius:24px}.controls{width:calc(100% - 16px)}.controls button{font-size:.78rem;padding:10px 11px}}

.decoStack{position:absolute!important;z-index:5!important;display:flex;gap:8px;align-items:center;max-width:72%;flex-wrap:wrap}.decoStack span{filter:drop-shadow(0 7px 12px #0008);line-height:1}.decoStack .small{font-size:2.8rem}.decoStack .medium{font-size:4rem}.decoStack .large{font-size:5.7rem}
.decoStack.pos-top-left{left:5%;top:5%}.decoStack.pos-top-center{left:50%;top:5%;transform:translateX(-50%);justify-content:center}.decoStack.pos-top-right{right:5%;top:5%;justify-content:flex-end}
.decoStack.pos-middle-left{left:5%;top:50%;transform:translateY(-50%)}.decoStack.pos-middle-center{left:50%;top:50%;transform:translate(-50%,-50%);justify-content:center}.decoStack.pos-middle-right{right:5%;top:50%;transform:translateY(-50%);justify-content:flex-end}
.decoStack.pos-bottom-left{left:5%;bottom:5%}.decoStack.pos-bottom-center{left:50%;bottom:5%;transform:translateX(-50%);justify-content:center}.decoStack.pos-bottom-right{right:5%;bottom:5%;justify-content:flex-end}
.ctaEn{font-size:clamp(.8rem,2.2vw,1.1rem);font-weight:800;margin-top:5px;color:#e6ecea;text-align:center;text-shadow:0 2px 8px #000}

.digitalOnly{display:none}.attentionBar{width:min(720px,calc(100vw - 28px));margin-top:9px;padding:10px 13px;border-radius:14px;background:linear-gradient(90deg,rgba(217,181,109,.18),rgba(18,59,62,.92));border:1px solid rgba(217,181,109,.32);align-items:center;justify-content:center;gap:11px;text-align:center;font-weight:900;box-shadow:0 12px 30px #0005}.attentionBar.show{display:flex}.attentionIcon{font-size:1.45rem;animation:phoneNudge 2.4s ease-in-out infinite}.attentionMain{font-size:.95rem}.attentionSub{font-size:.7rem;color:#b9c8c5;margin-top:2px}.selfieCount{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:rgba(0,0,0,.3);color:#fff;font-size:.72rem;white-space:nowrap}@keyframes phoneNudge{0%,70%,100%{transform:translateX(0) rotate(0)}82%{transform:translateX(6px) rotate(4deg)}90%{transform:translateX(-3px) rotate(-2deg)}}@keyframes qrPulse{0%,100%{box-shadow:0 16px 38px #0007,0 0 0 0 rgba(217,181,109,.32)}50%{box-shadow:0 16px 38px #0007,0 0 0 14px rgba(217,181,109,0)}}.attentionMode .poster .qrbox{animation:qrPulse 2s ease-in-out infinite}.exporting .poster .qrbox{animation:none!important}.exporting .digitalOnly{display:none!important}
.displayMode .attentionBar,:fullscreen .attentionBar{width:min(100vw,60svh);margin-top:4px;border-radius:0;padding:7px 10px}.displayMode.hasAttention.hasScreenAds .poster,.hasAttention.hasScreenAds:fullscreen .poster{width:min(100vw,60svh)!important}.displayMode.hasAttention:not(.hasScreenAds) .poster,.hasAttention:not(.hasScreenAds):fullscreen .poster{width:min(100vw,73svh)!important}
@media print{.digitalOnly{display:none!important}}
@media(max-width:540px){.attentionBar{width:calc(100% - 16px)}.attentionMain{font-size:.85rem}.selfieCount{font-size:.64rem}}

</style>
</head>
<body>
<div class="wrap" id="root"><div class="loading">QR-Event wird geladen …</div></div>
<script src="./config.js"></script>
<script src="https://unpkg.com/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const cfg=window.FTS_CONFIG,params=new URLSearchParams(location.search),ref=params.get('e')||cfg.defaultEventToken,display=params.get('display')==='1';
const headers={'apikey':cfg.publishableKey,'Authorization':'Bearer '+cfg.publishableKey,'Content-Type':'application/json'};
async function rpc(name,body){const r=await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${name}`,{method:'POST',headers,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/')}
function assetUrl(path){if(!path)return'';return `${cfg.supabaseUrl}/storage/v1/object/public/${encodeURIComponent(cfg.liveBucket)}/${encodePath(path)}`}
function boolish(v){return v===true||v===1||String(v).toLowerCase()==='true'}
function luxDate(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Luxembourg',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),get=t=>parts.find(x=>x.type===t)?.value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function adItemsFor(ev){
  if(!boolish(ev?.ads_enabled))return[];let items=ev?.ad_items;if(!Array.isArray(items)){try{items=JSON.parse(items||'[]')}catch{items=[]}}
  const today=luxDate();
  return items.filter(x=>{
    if(!x?.path||x.active===false)return false;
    const start=String(x.start_date||''),end=String(x.end_date||'');
    return (!start||today>=start)&&(!end||today<=end);
  });
}
function safeAdLink(v){try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}}
let screenAds=[],screenAdIndex=0,screenAdTimer=null;
function renderScreenAd(){
  const rail=document.getElementById('screenAd'),img=document.getElementById('screenAdImg'),a=document.getElementById('screenAdLink');
  if(!rail||!img||!a||!screenAds.length){rail?.classList.remove('show');document.documentElement.classList.remove('hasScreenAds');return}
  const item=screenAds[screenAdIndex%screenAds.length];img.src=assetUrl(item.path);img.alt=item.name||'Werbung';const href=safeAdLink(item.link);
  if(href){a.href=href;a.target='_blank';a.rel='noopener noreferrer'}else{a.removeAttribute('href');a.removeAttribute('target');a.removeAttribute('rel')}
  rail.classList.add('show');document.documentElement.classList.add('hasScreenAds');
}
function startScreenAds(ev){screenAds=adItemsFor(ev);if(screenAdTimer)clearInterval(screenAdTimer);screenAdIndex=0;renderScreenAd();if(screenAds.length>1)screenAdTimer=setInterval(()=>{screenAdIndex=(screenAdIndex+1)%screenAds.length;renderScreenAd()},3000)}
function logoItemsFor(ev,target){
  let items=[];
  if(Array.isArray(ev.logo_items))items=ev.logo_items;
  else{try{items=JSON.parse(ev.logo_items||'[]')}catch{}}
  if(!items.length&&ev.logo_path)items=[{path:ev.logo_path,name:'Logo',position:'top-right',size:'medium',show_poster:true,show_photo:true}];
  return items.filter(x=>x?.path && (target==='poster'?x.show_poster!==false:x.show_photo!==false));
}
function logoStacksHtml(ev){
  const groups={};
  logoItemsFor(ev,'poster').forEach(x=>(groups[x.position||'top-right']??=[]).push(x));
  return Object.entries(groups).map(([pos,items])=>
    `<div class="logoStack pos-${pos}">${items.map(x=>`<img class="${esc(x.size||'medium')}" crossorigin="anonymous" src="${assetUrl(x.path)}" alt="">`).join('')}</div>`
  ).join('');
}
function decorationItemsFor(ev){
  let items=[];
  if(Array.isArray(ev.decoration_items))items=ev.decoration_items;
  else{try{items=JSON.parse(ev.decoration_items||'[]')}catch{}}
  return items.filter(x=>x?.symbol && x.show_poster!==false);
}
function decoStacksHtml(ev){
  const groups={};
  decorationItemsFor(ev).forEach(x=>(groups[x.position||'bottom-right']??=[]).push(x));
  return Object.entries(groups).map(([pos,items])=>
    `<div class="decoStack pos-${pos}">${items.map(x=>`<span class="${esc(x.size||'medium')}">${esc(x.symbol)}</span>`).join('')}</div>`
  ).join('');
}
function parseArr(v){if(Array.isArray(v))return v;try{return JSON.parse(v||'[]')}catch{return[]}}
function posterLanguages(ev){
  const v=parseArr(ev?.poster_languages).filter(x=>['de','fr','en'].includes(x));
  return v.length?v:(ev?.poster_bilingual!==false?['de','en']:['de']);
}
function ctaLabel(lang){return ({de:'Scannen & Selfie hochladen',fr:'Scannez & envoyez votre selfie',en:'Scan & upload your selfie'})[lang]||'Scannen & Selfie hochladen'}
function attentionText(lang){
  return ({
    de:{main:'📸 Mach dein Event-Selfie',sub:'QR scannen · Selfie wählen · senden',count:n=>`Heute schon ${n} Selfies`},
    fr:{main:'📸 Faites votre selfie événement',sub:'Scanner · choisir le selfie · envoyer',count:n=>`Déjà ${n} selfies aujourd’hui`},
    en:{main:'📸 Make your event selfie',sub:'Scan · choose your selfie · send',count:n=>`${n} selfies already today`}
  })[lang]||null;
}
function qrDotType(v){return v==='dots'?'dots':v==='rounded'?'rounded':'square'}
function qrCornerType(v){return v==='dot'?'dot':v==='rounded'?'extra-rounded':'square'}
function renderQr(el,data,ev){
  el.innerHTML='';
  const image=ev.qr_logo_path?assetUrl(ev.qr_logo_path):undefined;
  const scale=Math.max(.10,Math.min(Number(ev.qr_logo_scale||.18),.24));
  if(window.QRCodeStyling){
    const qr=new QRCodeStyling({
      width:900,height:900,type:'canvas',data,
      image,
      margin:10,
      qrOptions:{errorCorrectionLevel:'H'},
      dotsOptions:{color:'#000000',type:qrDotType(ev.qr_dot_style)},
      cornersSquareOptions:{color:'#000000',type:qrCornerType(ev.qr_corner_style)},
      cornersDotOptions:{color:'#000000',type:ev.qr_corner_style==='dot'?'dot':'square'},
      backgroundOptions:{color:'#ffffff'},
      imageOptions:{crossOrigin:'anonymous',margin:8,imageSize:scale,hideBackgroundDots:true}
    });
    qr.append(el);
    return;
  }
  if(window.QRCode){
    new QRCode(el,{text:data,width:700,height:700,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
    if(image){
      const img=document.createElement('img');img.src=image;img.crossOrigin='anonymous';img.style.cssText=`position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:${scale*100}%;height:${scale*100}%;object-fit:contain;background:#fff;padding:2%;border-radius:10px;z-index:9`;el.style.position='relative';el.appendChild(img);
    }
  }
}
async function loadPosterEvent(){
  const core=await rpc('fts_get_event',{p_event_token:ref});
  if(!core?.length)throw new Error('Event nicht aktiv');
  const ev={...core[0],ads_enabled:false,ad_items:[]};
  try{
    const ads=await rpc('fts_get_event_ads_v2',{p_event_token:ref})
    if(ads?.length){ev.ads_enabled=boolish(ads[0].ads_enabled);ev.ad_items=ads[0].ad_items||[];}
  }catch(e){console.warn('Werbung konnte nicht geladen werden',e)}
  try{
    const ex=await rpc('fts_get_event_extras_public_v10',{p_event_token:ref});
    if(ex?.length)Object.assign(ev,ex[0]);
  }catch(e){console.warn('Poster-Zusatzdaten konnten nicht geladen werden',e)}
  return ev;
}
let selfieCountTimer=null;
async function refreshSelfieCount(ev,lang){
  const el=document.getElementById('selfieCount');if(!el)return;
  try{
    const n=await rpc('fts_get_event_selfie_count_v10',{p_event_token:ev.event_token||ref});
    const count=Number(n||0),txt=attentionText(lang)||attentionText('de');el.textContent=txt.count(count);
  }catch(e){el.textContent='📸'}
}
function setupAttention(ev){
  const enabled=ev.tablet_attention!==false,bar=document.getElementById('attentionBar');
  document.documentElement.classList.toggle('attentionMode',enabled);
  document.documentElement.classList.toggle('hasAttention',enabled);
  if(!enabled||!bar){bar?.classList.remove('show');return}
  const lang=posterLanguages(ev)[0]||'de',txt=attentionText(lang)||attentionText('de');
  document.getElementById('attentionMain').textContent=txt.main;
  document.getElementById('attentionSub').textContent=txt.sub;
  bar.classList.add('show');refreshSelfieCount(ev,lang);
  if(selfieCountTimer)clearInterval(selfieCountTimer);
  selfieCountTimer=setInterval(()=>refreshSelfieCount(ev,lang),10000);
}
async function boot(){
 try{
  const ev=await loadPosterEvent();
  document.documentElement.style.setProperty('--accent',ev.accent||'#d9b56d');document.documentElement.style.setProperty('--bg1',ev.bg1||'#071315');document.documentElement.style.setProperty('--bg2',ev.bg2||'#10383a');
  const root=document.getElementById('root');
  root.innerHTML=`<section class="poster${ev.poster_bg_path?' hasFlyer':''}" id="poster">
    ${ev.poster_bg_path?`<img class="flyer" crossorigin="anonymous" src="${assetUrl(ev.poster_bg_path)}">`:''}
    <div class="shade"></div><div class="glow one"></div><div class="glow two"></div>
    ${logoStacksHtml(ev)}
    ${decoStacksHtml(ev)}
    <div class="brand">FTS.LU · SELFIE EVENT</div><h1>${esc(ev.title)}</h1><div class="sub">${esc(ev.subtitle||'')}</div>
    <div class="qrbox"><div id="qr"></div></div>
    ${(()=>{const ls=posterLanguages(ev);return `<div class="cta">${esc(ctaLabel(ls[0]))}</div>${ls.slice(1).map(x=>`<div class="ctaEn">${esc(ctaLabel(x))}</div>`).join('')}`})()}
    <div class="foot">Produktion: FTS.lu</div>
    ${ev.short_code?`<div class="code">${esc(ev.short_code)}</div>`:''}
  </section>
  <div class="attentionBar digitalOnly" id="attentionBar"><span class="attentionIcon">📱</span><div><div class="attentionMain" id="attentionMain"></div><div class="attentionSub" id="attentionSub"></div></div><span class="selfieCount" id="selfieCount">…</span></div>
  <div class="screenAd" id="screenAd"><div class="screenAdLabel">Werbung</div><a id="screenAdLink"><img id="screenAdImg" alt="Werbung"></a></div>
  <div class="controls" id="controls"><button id="full">Vollbild / Anzeige</button><button id="png">PNG herunterladen</button><button id="print" class="secondary">A4 drucken</button></div>`;
  const guest=cfg.baseUrl+'?e='+encodeURIComponent(ev.short_code||ref);
  renderQr(document.getElementById('qr'),guest,ev);
  startScreenAds(ev);
  setupAttention(ev);
  document.getElementById('full').onclick=enterDisplay;document.getElementById('png').onclick=downloadPng;document.getElementById('print').onclick=printPoster;
  if(display){document.documentElement.classList.add('displayMode');setTimeout(()=>document.documentElement.requestFullscreen?.().catch(()=>{}),250)}
 }catch(e){console.error(e);document.getElementById('root').innerHTML='<div class="loading"><h2>Event konnte nicht geladen werden.</h2><p>Bitte prüfe den Event-Link.</p></div>'}
}
async function enterDisplay(){document.documentElement.classList.add('displayMode');try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{}}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&params.get('display')!=='1')document.documentElement.classList.remove('displayMode')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement)document.documentElement.classList.remove('displayMode')});
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function waitForPosterAssets(poster){
  const imgs=[...poster.querySelectorAll('img')];
  await Promise.all(imgs.map(img=>{
    if(img.complete&&img.naturalWidth)return Promise.resolve();
    return new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,2500)});
  }));
  await document.fonts?.ready;
  await sleep(180);
}
async function renderPosterCanvas(){
  const poster=document.getElementById('poster');if(!poster)throw new Error('Poster fehlt');
  await waitForPosterAssets(poster);
  document.documentElement.classList.add('exporting');
  try{
    const rect=poster.getBoundingClientRect();
    const scale=Math.max(1,1600/Math.max(rect.width,1));
    const raw=await html2canvas(poster,{scale,backgroundColor:null,useCORS:true,allowTaint:false,logging:false});
    const out=document.createElement('canvas');out.width=1600;out.height=2000;
    const ctx=out.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(raw,0,0,1600,2000);
    return out;
  }finally{document.documentElement.classList.remove('exporting')}
}
async function downloadPng(){
  const btn=document.getElementById('png');const old=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent='PNG wird erstellt …'}
  try{
    const c=await renderPosterCanvas();
    const name='FTS-'+String(ref).replace(/[^a-z0-9_-]/gi,'-')+'-QR-Poster-1600x2000.png';
    const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));
    if(blob){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.download=name;a.href=url;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
    else{const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()}
  }catch(e){console.error(e);alert('Das Poster konnte nicht als PNG erstellt werden. Bitte Seite neu laden und erneut versuchen.')}
  finally{if(btn){btn.disabled=false;btn.textContent=old||'PNG herunterladen'}}
}
async function printPoster(){
  const btn=document.getElementById('print');const old=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent='Druck wird vorbereitet …'}
  let sheet;
  try{
    const c=await renderPosterCanvas();
    sheet=document.createElement('div');sheet.className='printSheet';
    const img=document.createElement('img');img.alt='FTS QR Poster';img.src=c.toDataURL('image/png');sheet.appendChild(img);document.body.appendChild(sheet);
    if(img.decode)await img.decode().catch(()=>{});
    await sleep(120);
    window.print();
  }catch(e){console.error(e);alert('Die Druckansicht konnte nicht vorbereitet werden. Bitte Seite neu laden und erneut versuchen.')}
  finally{
    setTimeout(()=>sheet?.remove(),1200);
    if(btn){btn.disabled=false;btn.textContent=old||'A4 drucken'}
  }
}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=70',{updateViaCache:'none'}).then(reg=>{reg.update().catch(()=>{});const w=reg.active||reg.waiting||reg.installing;w?.postMessage?.({type:'FTS_PURGE_OLD_CACHES'});return reg}).catch(()=>{});boot();
