<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FTS QR Event</title>
<style>:root{font-family:Inter,system-ui,sans-serif;background:#061012;color:#fff;--accent:#d9b56d;--bg1:#071315;--bg2:#10383a}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#061012;display:grid;place-items:center;padding:16px}.poster{width:min(760px,96vw);aspect-ratio:4/5;border-radius:34px;background:linear-gradient(145deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7%;box-shadow:0 30px 90px #0008}.brand{color:var(--accent);letter-spacing:.2em;font-weight:900;font-size:clamp(.7rem,1.8vw,1.05rem)}h1{font-size:clamp(2.35rem,8vw,5.1rem);margin:16px 0 4px;line-height:.95;text-align:center}.sub{color:var(--accent);font-size:clamp(1.2rem,3vw,2rem);font-weight:800;margin-bottom:4%}.qrbox{background:#fff;border-radius:26px;padding:5%;width:min(75%,520px)}#qr{display:grid;place-items:center}#qr img,#qr canvas{width:100%!important;height:auto!important;display:block}.cta{font-size:clamp(1.05rem,2.7vw,1.55rem);font-weight:900;margin-top:4%;text-align:center}.foot{margin-top:4%;color:#9fb0ad}.controls{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:9px;z-index:5}button{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#102020;font-weight:900}.loading{padding:40px;text-align:center}</style></head>
<body><div id="root" class="loading">QR-Event wird geladen …</div>
<script src="./config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const cfg=window.FTS_CONFIG,t=new URLSearchParams(location.search).get('e')||cfg.defaultEventToken;
const headers={'apikey':cfg.publishableKey,'Authorization':'Bearer '+cfg.publishableKey,'Content-Type':'application/json'};
async function rpc(name,body){const r=await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${name}`,{method:'POST',headers,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return JSON.parse(await r.text())}
async function boot(){
 try{
  const data=await rpc('fts_get_event',{p_event_token:t});if(!data?.length)throw new Error('Event nicht aktiv');
  const ev=data[0];document.documentElement.style.setProperty('--accent',ev.accent);document.documentElement.style.setProperty('--bg1',ev.bg1);document.documentElement.style.setProperty('--bg2',ev.bg2);
  document.getElementById('root').className='';document.getElementById('root').innerHTML=`<section class="poster" id="poster"><div class="brand">FTS.LU · SELFIE EVENT</div><h1>${esc(ev.title)}</h1><div class="sub">${esc(ev.subtitle||'')}</div><div class="qrbox"><div id="qr"></div></div><div class="cta">Scannen & Selfie hochladen</div><div class="foot">FTS.lu · Eventfotografie</div></section><div class="controls"><button id="full">Vollbild</button><button id="png">Poster als PNG</button></div>`;
  const guest=cfg.baseUrl+'?e='+encodeURIComponent(ev.event_token);
  new QRCode(document.getElementById('qr'),{text:guest,width:700,height:700,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H});
  document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
  document.getElementById('png').onclick=async()=>{const c=await html2canvas(document.getElementById('poster'),{scale:2,backgroundColor:null});const a=document.createElement('a');a.download='fts-event-qr.png';a.href=c.toDataURL('image/png');a.click()};
 }catch(e){document.getElementById('root').innerHTML='<h2>Event konnte nicht geladen werden.</h2>'}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
boot();
</script></body></html>
