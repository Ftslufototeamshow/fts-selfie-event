<style>
:root{font-family:Inter,system-ui,sans-serif;background:#071315;color:#f5f1e8;--accent:#d9b56d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#071113,#102426);min-height:100vh}.wrap{width:min(1180px,calc(100% - 24px));margin:auto;padding:26px 0 50px}.brand{font-size:.72rem;letter-spacing:.2em;color:var(--accent);font-weight:900}h1{font-size:clamp(2rem,6vw,3.7rem);margin:8px 0 10px}.intro{color:#91a5a1;margin-bottom:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}.btn,.downloadBtn{border:0;background:var(--accent);color:#102020;text-decoration:none;font-weight:900;padding:10px 12px;border-radius:10px;font-size:.82rem;cursor:pointer}.btn.secondary,.downloadBtn.secondary{background:#15383a;color:#f5f1e8;border:1px solid rgba(255,255,255,.09)}.btn:disabled,.downloadBtn:disabled{opacity:.5;cursor:wait}.event{background:#071719;border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:16px;margin-bottom:20px}.eventHead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:13px}.eventTitle{font-size:1.55rem;font-weight:900}.meta{color:#95a8a4;font-size:.84rem}.expires{color:var(--accent);font-size:.78rem;font-weight:800}.eventActions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.albumShareBtn{width:100%;border:0;border-radius:12px;padding:13px 14px;background:#6f4c98;color:#fff;font:inherit;font-weight:950;cursor:pointer}.albumShareBtn:disabled{opacity:.55;cursor:wait}.albumShareHint{font-size:.7rem;color:#95a8a4;margin:-4px 0 12px}.dayShareHint{font-size:.66rem;color:#8ca09c;margin:-2px 0 8px}.dayFolder{margin-top:14px;padding:13px;border-radius:18px;background:#081d1f;border:1px solid rgba(255,255,255,.08)}.dayHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.dayTitle{font-weight:950;color:#f3efe7;font-size:1.05rem}.dayCount{font-size:.74rem;color:#8da09c;font-weight:800}.dayActions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 9px}.dayActions .downloadBtn{background:var(--accent);color:#102020}.dayShareBtn{border:0;border-radius:10px;padding:10px 12px;background:#6f4c98;color:#fff;font:inherit;font-size:.82rem;font-weight:950;cursor:pointer}.dayShareBtn:disabled{opacity:.55;cursor:wait}.swipeHint{font-size:.7rem;color:#819390;margin-bottom:7px}.photos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch;padding:2px 2px 10px;scrollbar-width:thin}.card{flex:0 0 clamp(160px,43vw,220px);scroll-snap-align:start;background:#0b1e20;border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:8px}.label{font-size:.68rem;color:var(--accent);font-weight:900;margin:2px 2px 6px}.card img{width:100%;aspect-ratio:4/5;object-fit:contain;border-radius:10px;background:#061012;display:block;cursor:zoom-in}.links{display:grid;gap:6px;margin-top:8px}.links .btn,.links .downloadBtn{width:100%;text-align:center;font-size:.7rem;padding:8px 7px}.empty{color:#819390;padding:14px 4px}.status{display:none;margin:0 0 18px;padding:11px 13px;border-radius:11px;background:#0a2426;color:#cbd7d5}.status.show{display:block}.eventAds{margin-top:16px;padding:13px;border-radius:18px;background:linear-gradient(145deg,#081d1f,#0b2628);border:1px solid rgba(217,181,109,.22);overflow:hidden}.eventAdsHead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:9px}.eventAdsTitle{font-weight:950;color:var(--accent);font-size:1rem}.eventAdsMeta{font-size:.68rem;color:#849793;text-align:right}.eventAdLink{display:block;text-decoration:none;border-radius:13px;overflow:hidden;background:#02090a;border:1px solid rgba(255,255,255,.07)}.eventAdLink.noLink{cursor:default}.eventAdImage{display:block;width:100%;aspect-ratio:4/1;object-fit:cover;background:#02090a}.eventAdFoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.eventAdName{font-size:.76rem;font-weight:900;color:#dce4e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.eventAdCounter{font-size:.67rem;color:#879995;white-space:nowrap}.socialPanel{margin-top:16px;padding:14px;border-radius:18px;background:#081d1f;border:1px solid rgba(217,181,109,.25)}.socialPanel h3{margin:0 0 5px;color:var(--accent);font-size:1.05rem}.socialIntro{font-size:.78rem;line-height:1.45;color:#9fb0ad}.socialPermission{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;padding:11px;border-radius:12px;background:#0b292b;border:1px solid rgba(255,255,255,.08)}.socialPermission label{display:flex;align-items:center;gap:9px;font-weight:900;font-size:.82rem}.socialPermission input{width:20px;height:20px}.permissionState{font-size:.7rem;font-weight:950;color:#8fa6a2}.permissionState.on{color:#7de1ad}.socialText{width:100%;min-height:126px;resize:vertical;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:#061315;color:#edf2f0;padding:11px;font:inherit;font-size:.8rem;line-height:1.45}.socialActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.socialActions button{border:0;border-radius:10px;padding:10px 11px;font-weight:900;cursor:pointer}.socialCopy{background:#173739;color:#fff}.socialShareAll{background:var(--accent);color:#102020}.socialCount{font-size:.72rem;color:#8fa6a2;margin-top:8px}.postTools{margin-top:8px;border-top:1px solid rgba(255,255,255,.07);padding-top:7px}.postTools summary{cursor:pointer;color:#d5dedc;font-size:.7rem;font-weight:900}.postToolsBody{display:grid;gap:6px;margin-top:7px}.postPrivacyInfo{padding:7px 8px;border-radius:9px;background:#0f2a2c;color:#98d8c0;font-size:.65rem;font-weight:900;line-height:1.3}.postTools button{width:100%;border:0;border-radius:9px;padding:8px 7px;font-size:.68rem;font-weight:900;cursor:pointer}.postSelect{background:#285b4d;color:#fff}.postSelect.off{background:#2f3435;color:#aebbb9}.postPrivacy{background:#173739;color:#fff}.postPrivacy.active{background:#285b4d}.postShare{background:#694d8e;color:#fff}@media(max-width:480px){.toolbar .btn{width:100%}.eventActions .downloadBtn{width:100%}.dayActions{display:grid;grid-template-columns:1fr}.dayActions .downloadBtn{width:100%}.card{flex-basis:44vw;min-width:145px}}

<body>
<main class="wrap">
  <div class="brand">FTS.LU · KUNDENGALERIE</div>
  <h1>Aktuelle Events</h1>
  <div class="intro">Hier werden ausschließlich die freigegebenen fertigen Event-Designs mit Event-Layout/Logo angezeigt. Mehrtägige Veranstaltungen sind nach Tagen getrennt. Originaldateien bleiben ausschließlich im internen FTS-Bereich.</div>
  <div class="toolbar"><button class="btn secondary" id="refreshBtn">Galerie aktualisieren</button></div>
  <div id="status" class="status"></div><div id="events">Galerie wird geladen …</div>
</main>
<script src="./config.js"></script>
<script src="./social-share.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const cfg=window.FTS_CONFIG,client=supabase.createClient(cfg.supabaseUrl,cfg.publishableKey),customerToken=new URLSearchParams(location.search).get('c');
const liveBase=`${cfg.supabaseUrl}/storage/v1/object/public/${cfg.liveBucket}/`,directDownloadUrl=`${cfg.supabaseUrl}/functions/v1/fts-direct-download-v39`;
const $=s=>document.querySelector(s);$('#refreshBtn').onclick=()=>location.reload();
const customerAdTimers=new Map(),customerSocialState=new Map();
function luxToday(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Luxembourg',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const get=t=>parts.find(x=>x.type===t)?.value||'00';
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function safeHttpUrl(v){try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}}
function activeAdItems(row){
  if(!row?.ads_enabled)return[];
  let items=row.ad_items;if(!Array.isArray(items)){try{items=JSON.parse(items||'[]')}catch{items=[]}}
  const today=luxToday();
  return items.filter(x=>{
    if(!x?.path||x.active===false)return false;
    const start=String(x.start_date||''),end=String(x.end_date||'');
    return (!start||today>=start)&&(!end||today<=end);
  });
}
function customerAdUrl(path){return liveBase+enc(path)}
async function attachEventAds(ev,section){
  try{
    const {data,error}=await client.rpc('fts_get_event_ads_v2',{p_event_token:ev.event_token});
    if(error)throw error;
    const row=Array.isArray(data)?data[0]:data,items=activeAdItems(row);
    if(!items.length)return;
    const box=document.createElement('section');box.className='eventAds';
    box.innerHTML=`<div class="eventAdsHead"><div class="eventAdsTitle">Werbung im Event</div><div class="eventAdsMeta">Live-Anzeige · Wechsel alle 3 Sek.</div></div><a class="eventAdLink" rel="noopener noreferrer"><img class="eventAdImage" alt="Werbung"></a><div class="eventAdFoot"><div class="eventAdName"></div><div class="eventAdCounter"></div></div>`;
    section.appendChild(box);
    const link=box.querySelector('.eventAdLink'),img=box.querySelector('.eventAdImage'),name=box.querySelector('.eventAdName'),counter=box.querySelector('.eventAdCounter');
    let index=0;
    const show=()=>{
      const item=items[index%items.length],href=safeHttpUrl(item.link);
      img.src=customerAdUrl(item.path);img.alt=item.name||'Werbung';name.textContent=item.name||'Werbung';counter.textContent=(index%items.length+1)+' / '+items.length;
      if(href){link.href=href;link.target='_blank';link.classList.remove('noLink')}else{link.removeAttribute('href');link.removeAttribute('target');link.classList.add('noLink')}
    };
    show();
    if(items.length>1){
      const old=customerAdTimers.get(ev.event_token);if(old)clearInterval(old);
      customerAdTimers.set(ev.event_token,setInterval(()=>{index=(index+1)%items.length;show()},3000));
    }
  }catch(e){console.warn('Kundenportal Werbung',e)}
}
function submitDirectDownload(fields,button,label='Download wird gestartet …'){
  const old=button?.textContent||'Herunterladen';
  if(button){button.disabled=true;button.textContent=label}
  const form=document.createElement('form');form.method='POST';form.action=directDownloadUrl;form.style.display='none';
  for(const [name,value] of Object.entries(fields||{})){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=String(value??'');form.appendChild(input)}
  document.body.appendChild(form);form.submit();setTimeout(()=>{form.remove();if(button){button.disabled=false;button.textContent=old}},1400);
}
function downloadCustomerZip(ev,day,filename,button){
  submitDirectDownload({action:'zip',mode:'customer',customer_token:customerToken,event_token:ev.event_token,day,title:ev.title||'event',filename},button,'ZIP wird geladen …');
  setStatus('✓ ZIP-Download wurde gestartet.');
}
function downloadCustomerFile(eventToken,photoId,button){
  submitDirectDownload({action:'file',mode:'customer',customer_token:customerToken,event_token:eventToken,photo_id:photoId,file_kind:'design'},button,'Foto wird geladen …');
  setStatus('✓ Foto-Download wurde gestartet.');
}
function socialDataFor(ev,socialMap){return socialMap.get(ev.event_token)||{event_token:ev.event_token,event_title:ev.title,organizer_name:ev.title,location:ev.location||'',fts_can_post:false}}
function socialFilename(zipPath){return (String(zipPath||'').split('/').pop()||'FTS-Selfie.jpg').replace(/[^a-zA-Z0-9._-]+/g,'-')}
function socialSelectedItems(state){return [...state.items.values()].filter(x=>x.selected)}
function updateSocialCount(state){
  const el=state.panel?.querySelector('[data-social-count]');if(!el)return;
  const n=socialSelectedItems(state).length,total=state.items.size;el.textContent=n+' von '+total+' Fotos für Posting ausgewählt';
}
async function shareCustomerAlbum(ev,state,button){
  const items=socialSelectedItems(state);
  if(!items.length)return setStatus('Bitte mindestens ein Foto mit „Für Posting ✓“ auswählen.');
  const old=button?.textContent||'Album auf Social Media teilen';
  if(button){button.disabled=true;button.textContent='Album wird vorbereitet …'}
  setStatus('Hintergrundschutz wird für die ausgewählten Fotos geprüft …');
  try{
    const text=state.panel?.querySelector('[data-social-text]')?.value||FTS_SOCIAL.shareText('organizer',{eventTitle:state.social.event_title||ev.title,organizer:state.social.organizer_name||ev.title,location:state.social.location||ev.location||''},'de');
    const result=await FTS_SOCIAL.shareMany({
      items:items.map(x=>({url:x.url,name:socialFilename(x.zipPath),privacy:true})),
      text,
      title:ev.title
    });
    if(result.shared)setStatus('✓ Social-Media-Teilen geöffnet. Der Posting-Text wurde zusätzlich kopiert.');
    else setStatus('Dieses Handy bzw. diese App unterstützt nicht das gemeinsame Teilen aller Fotos. Der Posting-Text wurde kopiert – einzelne Fotos können weiterhin direkt geteilt werden.');
  }catch(err){
    if(err?.name!=='AbortError')setStatus('Album konnte nicht zum Teilen vorbereitet werden: '+(err?.message||'Fehler'));
  }finally{
    if(button){button.disabled=false;button.textContent=old}
  }
}
function socialDayItems(state,day){return [...state.items.values()].filter(x=>x.selected&&String(x.day||'')===String(day||''))}
async function shareCustomerDay(ev,state,day,button){
  const items=socialDayItems(state,day);
  if(!items.length)return setStatus('Für diesen Tag ist kein Foto mit „Für Posting ✓“ ausgewählt.');
  const old=button?.textContent||'Tag auf Social Media teilen';
  if(button){button.disabled=true;button.textContent='Fotos werden vorbereitet …'}
  setStatus('Hintergrundschutz wird für dieses Tagesalbum geprüft …');
  try{
    const text=state.panel?.querySelector('[data-social-text]')?.value||FTS_SOCIAL.shareText('organizer',{eventTitle:state.social.event_title||ev.title,organizer:state.social.organizer_name||ev.title,location:state.social.location||ev.location||''},'de');
    const result=await FTS_SOCIAL.shareMany({items:items.map(x=>({url:x.url,name:socialFilename(x.zipPath),privacy:true})),text,title:ev.title+' · '+day});
    if(result.shared)setStatus('✓ Tagesalbum zum Teilen geöffnet. Es werden Bilddateien übergeben – kein Galerie-Link.');
    else setStatus('Dieses Handy bzw. die gewählte App unterstützt mehrere Fotos nicht in einem Schritt. Es wurde kein Galerie-Link geteilt. Die einzelnen Fotos können weiterhin direkt geteilt werden.');
  }catch(err){
    if(err?.name!=='AbortError')setStatus('Tagesalbum konnte nicht zum Teilen vorbereitet werden: '+(err?.message||'Fehler'));
  }finally{if(button){button.disabled=false;button.textContent=old}}
}
async function openCustomerPrivacyEditor(item,state){
  if(!item||!window.FTS_SOCIAL)return;
  FTS_SOCIAL.setManualMasks(item.url,item.privacyMasks||[],{persist:true});
  const result=await FTS_SOCIAL.openPrivacyEditor({
    url:item.url,
    title:'Hintergrundschutz · '+(item.day?weekday(item.day)+' '+fmt(item.day):'Event-Foto'),
    masks:item.privacyMasks||[],
    initialProtected:true,
    onMasksChange:async masks=>{
      item.privacyMasks=masks;
      if(item.photoId){
        const {error}=await client.rpc('fts_customer_set_privacy_masks_v38',{p_customer_token:customerToken,p_photo_id:item.photoId,p_masks:masks});
        if(error)throw error;
      }
    }
  });
  item.privacyMasks=result?.masks||FTS_SOCIAL.getManualMasks(item.url);
  setStatus(item.privacyMasks.length?'✓ Manuelle Datenschutz-Markierungen gespeichert.':'Datenschutz-Vorschau geschlossen.');
}
async function attachSocialPanel(ev,section,state){
  const box=document.createElement('section');box.className='socialPanel';
  const text=FTS_SOCIAL.shareText('organizer',{eventTitle:state.social.event_title||ev.title,organizer:state.social.organizer_name||ev.title,location:state.social.location||ev.location||''},'de');
  box.innerHTML=`<h3>Social-Media & Datenschutz</h3><div class="socialIntro">Fotos für das Posting auswählen, Hintergrund-Gesichter vor dem Teilen prüfen und den vorbereiteten Veranstalter-Text verwenden. Beim Teilen wird automatisch die geschützte Version erzeugt.</div><div class="socialPermission"><label><input type="checkbox" data-fts-permission ${state.social.fts_can_post?'checked':''}> FTS darf Event-Fotos posten</label><span class="permissionState ${state.social.fts_can_post?'on':''}" data-permission-state>${state.social.fts_can_post?'FREIGEGEBEN':'NICHT FREIGEGEBEN'}</span></div><textarea class="socialText" data-social-text></textarea><div class="socialActions"><button class="socialCopy" data-social-copy>Text kopieren</button><button class="socialShareAll" data-social-share>Alle ausgewählten Fotos teilen</button></div><div class="socialCount" data-social-count></div>`;
  section.appendChild(box);state.panel=box;box.querySelector('[data-social-text]').value=text;updateSocialCount(state);
  const permission=box.querySelector('[data-fts-permission]'),pstate=box.querySelector('[data-permission-state]');
  permission.onchange=async()=>{
    permission.disabled=true;
    try{
      const {error}=await client.rpc('fts_customer_set_fts_post_permission_v36',{p_customer_token:customerToken,p_event_token:ev.event_token,p_allowed:permission.checked});
      if(error)throw error;state.social.fts_can_post=permission.checked;pstate.textContent=permission.checked?'FREIGEGEBEN':'NICHT FREIGEGEBEN';pstate.classList.toggle('on',permission.checked);setStatus(permission.checked?'✓ FTS-Postingfreigabe wurde gespeichert.':'FTS-Postingfreigabe wurde ausgeschaltet.');
    }catch(e){permission.checked=!permission.checked;setStatus('Freigabe konnte nicht gespeichert werden.')}
    finally{permission.disabled=false}
  };
  box.querySelector('[data-social-copy]').onclick=async()=>{const ok=await FTS_SOCIAL.copyText(box.querySelector('[data-social-text]').value);setStatus(ok?'✓ Posting-Text kopiert.':'Text konnte nicht kopiert werden.')};
  box.querySelector('[data-social-share]').onclick=e=>shareCustomerAlbum(ev,state,e.currentTarget);
}
function bindCardSocial(el,url,zipPath,state,photoId=null,initialSelected=true,day='',privacyMasks=[]){
  const img=el.querySelector('img'),sel=el.querySelector('[data-post-select]'),priv=el.querySelector('[data-post-privacy]'),share=el.querySelector('[data-post-share]'),key=String(photoId||url);
  const item={key,photoId:photoId||null,url,zipPath,selected:initialSelected!==false,day:String(day||''),privacyMasks:Array.isArray(privacyMasks)?privacyMasks:[]};
  state.items.set(key,item);FTS_SOCIAL.setManualMasks(url,item.privacyMasks,{persist:true});
  sel.classList.toggle('off',initialSelected===false);sel.textContent=initialSelected===false?'Nicht im Posting':'Für Posting ✓';updateSocialCount(state);
  sel.onclick=async()=>{const next=!item.selected,old=item.selected;sel.disabled=true;item.selected=next;sel.classList.toggle('off',!next);sel.textContent=next?'Für Posting ✓':'Nicht im Posting';updateSocialCount(state);try{if(item.photoId){const {error}=await client.rpc('fts_customer_set_social_photo_v36',{p_customer_token:customerToken,p_photo_id:item.photoId,p_selected:next});if(error)throw error}setStatus(next?'✓ Foto ist für Posting freigegeben.':'Foto wurde aus der Posting-Auswahl entfernt.')}catch(e){item.selected=old;sel.classList.toggle('off',!old);sel.textContent=old?'Für Posting ✓':'Nicht im Posting';updateSocialCount(state);setStatus('Foto-Auswahl konnte nicht gespeichert werden.')}finally{sel.disabled=false}};
  priv.onclick=()=>openCustomerPrivacyEditor(item,state);
  img.onclick=()=>openCustomerPrivacyEditor(item,state);
  share.onclick=async()=>{const old=share.textContent;share.disabled=true;share.textContent='Wird vorbereitet …';try{const text=state.panel?.querySelector('[data-social-text]')?.value||FTS_SOCIAL.shareText('organizer',{eventTitle:state.social.event_title,organizer:state.social.organizer_name},'de');const r=await FTS_SOCIAL.shareOne({url,name:socialFilename(zipPath),text,privacy:true});setStatus(r.shared?'✓ Teilen geöffnet. Das geschützte Foto wird als Bilddatei übergeben; Text wurde mitkopiert.':'Geschütztes Foto wurde vorbereitet/heruntergeladen; Posting-Text wurde kopiert.')}catch(e){if(e?.name!=='AbortError')setStatus('Teilen konnte nicht gestartet werden.')}finally{share.disabled=false;share.textContent=old}};
}
function setStatus(text){const s=$('#status');s.textContent=text;s.classList.toggle('show',!!text)}
function eventDaysOf(ev){let d=ev.event_days;if(!Array.isArray(d)){try{d=JSON.parse(d||'[]')}catch{d=[]}}if(!d.length)d=[ev.event_date];return [...new Set(d.filter(Boolean))].sort()}
function enc(p){return String(p||'').split('/').map(encodeURIComponent).join('/')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('de-DE'):''}function fmtDT(d){return d?new Date(d).toLocaleDateString('de-DE'):''}function weekday(d){return new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long'})}function slug(s){return String(s||'event').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function fileExt(p){const m=String(p||'').match(/(\.[a-z0-9]{2,5})$/i);return m?m[1].toLowerCase():'.jpg'}function fileStem(p){const n=String(p||'').split('/').pop()||'foto';return n.replace(/\.[^.]+$/,'')}
async function boot(){if(!customerToken){$('#events').innerHTML='<div class="empty">Kundenlink unvollständig.</div>';return}const [{data:events,error:e1},{data:photos,error:e2},{data:socialRows,error:e3}]=await Promise.all([client.rpc('fts_get_customer_events_v9',{p_customer_token:customerToken}),client.rpc('fts_get_customer_designs_v38',{p_customer_token:customerToken}),client.rpc('fts_customer_social_status_v36',{p_customer_token:customerToken})]);if(e1||e2||e3){console.error(e1||e2||e3);$('#events').textContent='Galerie konnte nicht geladen werden.';return}if(!events?.length){$('#events').innerHTML='<div class="empty">Aktuell sind keine freigegebenen Events sichtbar.</div>';return}
  const socialMap=new Map((socialRows||[]).map(x=>[String(x.event_token),x]));const map=new Map();for(const p of photos||[]){if(!map.has(p.event_token))map.set(p.event_token,new Map());const day=p.event_day||p.event_date,dm=map.get(p.event_token);if(!dm.has(day))dm.set(day,[]);dm.get(day).push(p)}const root=$('#events');root.innerHTML='';
  for(const ev of events){const section=document.createElement('section');section.className='event';const days=eventDaysOf(ev),state={social:socialDataFor(ev,socialMap),items:new Map(),panel:null};customerSocialState.set(String(ev.event_token),state);section.innerHTML=`<div class="eventHead"><div><div class="eventTitle">${esc(ev.title)}${ev.subtitle?' · '+esc(ev.subtitle):''}</div><div class="meta">${esc(ev.location||'')} · ${days.map(fmt).join(' · ')}</div></div><div class="expires">sichtbar bis ${fmtDT(ev.expires_at)}</div></div><div class="eventActions"><button type="button" class="albumShareBtn" data-album-share>Gesamtes Event auf Social Media teilen</button></div><div class="albumShareHint">Alle Event-Tage zusammen · nur „Für Posting ✓“ · Hintergrundschutz beim Teilen automatisch aktiv</div><div class="dayFolders"></div>`;root.appendChild(section);const folders=section.querySelector('.dayFolders'),albumShareBtn=section.querySelector('[data-album-share]'),dayMap=map.get(ev.event_token)||new Map();
    for(const day of days){const dayItems=[],folder=document.createElement('section');folder.className='dayFolder';folder.innerHTML=`<div class="dayHead"><div class="dayTitle">${weekday(day)} · ${fmt(day)}</div><div class="dayCount" data-day-count>0 Fotos</div></div><div class="dayActions"><button class="downloadBtn dayZip" disabled>${weekday(day)} als ZIP herunterladen</button><button class="dayShareBtn" disabled data-day-share>${weekday(day)} auf Social Media teilen</button></div><div class="dayShareHint">Teilt die ausgewählten Bilddateien dieses Tages über die Handy-Teilen-Funktion · kein Galerie-Link.</div><div class="swipeHint">Fertige Event-Designs · ← nach links/rechts wischen →</div><div class="photos"></div>`;folders.appendChild(folder);const grid=folder.querySelector('.photos'),dayZip=folder.querySelector('.dayZip'),dayShare=folder.querySelector('[data-day-share]'),dayCount=folder.querySelector('[data-day-count]');let count=0;
      for(const p of dayMap.get(day)||[]){const url=liveBase+enc(p.designed_path),base=fileStem(p.designed_path),zipPath=`${slug(ev.title)}/${day}/Event-Designs/${base}${fileExt(p.designed_path)}`;addDesignCard(grid,url,zipPath,state,p.photo_id,p.social_selected!==false,day,p.privacy_masks||[]);dayItems.push({url,zipPath});count++}
      if(ev.legacy_prefix&&day===ev.event_date)count+=await addLegacyDesigns(ev,grid,dayItems,day,state);
      dayCount.textContent=count+' Foto'+(count===1?'':'s');
      if(!count)grid.innerHTML='<div class="empty">Noch keine fertigen Event-Designs an diesem Tag.</div>';else{dayZip.disabled=dayItems.length===0;dayZip.onclick=()=>{const filename=`FTS-${slug(ev.title)}-${day}-event-designs.zip`;if(ev.legacy_prefix&&day===ev.event_date)downloadZip(dayItems,filename,dayZip);else downloadCustomerZip(ev,day,filename,dayZip)};dayShare.disabled=false;dayShare.onclick=()=>shareCustomerDay(ev,state,day,dayShare)}
    }
    await attachSocialPanel(ev,section,state);
    albumShareBtn.onclick=()=>shareCustomerAlbum(ev,state,albumShareBtn);
    await attachEventAds(ev,section);
  }
}
function addDesignCard(grid,url,zipPath,state,photoId=null,initialSelected=true,day='',privacyMasks=[]){
  const el=document.createElement('article');el.className='card';
  el.innerHTML=`<div class="label">Event-Design</div><img src="${url}" loading="lazy" alt="Event-Design · groß prüfen"><div class="links"><button class="downloadBtn">Event-Design herunterladen</button><a class="btn secondary" href="${url}" target="_blank" rel="noopener">Design öffnen</a></div><details class="postTools"><summary>Posten / Datenschutz</summary><div class="postToolsBody"><button class="postSelect" data-post-select>Für Posting ✓</button><div class="postPrivacyInfo">🔒 Beim Teilen automatisch aktiv · Bild antippen = groß prüfen</div><button class="postPrivacy" data-post-privacy>Hintergrundschutz groß prüfen</button><button class="postShare" data-post-share>Facebook / Instagram / TikTok / Story teilen</button></div></details>`;
  const key=String(photoId||url),img=el.querySelector('img');
  img.addEventListener('error',()=>{el.remove();state?.items?.delete(key);updateSocialCount(state);if(!grid.querySelector('.card'))grid.innerHTML='<div class="empty">Keine verfügbaren Designs.</div>'});
  el.querySelector('.links button').onclick=()=>{const b=el.querySelector('.links button');if(photoId)downloadCustomerFile(state?.social?.event_token||'',photoId,b);else downloadOne(url,zipPath.split('/').pop(),b)};
  grid.appendChild(el);if(state)bindCardSocial(el,url,zipPath,state,photoId,initialSelected,day,privacyMasks);
}
async function addLegacyDesigns(ev,grid,items,day,state){let count=0;try{const b=ev.legacy_bucket||cfg.legacyBucket,{data,error}=await client.storage.from(b).list(`${ev.legacy_prefix}/designed`,{limit:1000});if(error)throw error;for(const d of (data||[]).filter(x=>x.name&&x.name!=='.emptyFolderPlaceholder')){const path=`${ev.legacy_prefix}/designed/${d.name}`,url=await signed(b,path),zipPath=`${slug(ev.title)}/${day}/Event-Designs/${d.name}`;addDesignCard(grid,url,zipPath,state,null,true,day,[]);items.push({url,zipPath});count++}}catch(e){console.warn('Legacy designs',e)}return count}
async function signed(bucket,path){const {data,error}=await client.storage.from(bucket).createSignedUrl(path,21600);if(error)throw error;return data.signedUrl}
async function fetchBlob(url){const r=await fetch(url,{mode:'cors'});if(!r.ok)throw new Error(`Download fehlgeschlagen (${r.status})`);return r.blob()}
async function downloadOne(url,filename,button){const old=button.textContent;button.disabled=true;button.textContent='Wird geladen …';try{saveBlob(await fetchBlob(url),filename)}catch(e){window.open(url,'_blank','noopener')}finally{button.disabled=false;button.textContent=old}}
async function downloadZip(items,filename,button){if(!items.length)return;const old=button.textContent;button.disabled=true;try{const zip=new JSZip();let done=0;for(const item of items){try{zip.file(item.zipPath,await fetchBlob(item.url))}catch(e){console.warn(e)}done++;setStatus(`ZIP wird vorbereitet: ${done} von ${items.length} …`)}setStatus('ZIP wird komprimiert …');saveBlob(await zip.generateAsync({type:'blob',compression:'STORE'}),filename);setStatus('✓ Download wurde erstellt.')}catch(e){setStatus('ZIP konnte nicht erstellt werden.')}finally{button.disabled=false;button.textContent=old}}
function saveBlob(blob,filename){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});boot();
</script>
