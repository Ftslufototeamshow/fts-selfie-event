<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTS Selfie Event Manager</title>
<style>:root{font-family:Inter,system-ui,sans-serif;background:#071315;color:#f4f1e9;--accent:#d9b56d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#071113,#10383a);min-height:100vh}.wrap{width:min(980px,calc(100% - 24px));margin:auto;padding:24px 0 50px}.brand{font-size:.72rem;letter-spacing:.2em;color:var(--accent);font-weight:900}h1{font-size:clamp(2rem,6vw,3.7rem);margin:7px 0 18px}.card{background:#071719;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:17px;margin:14px 0}h2{margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;color:#9eb0ad;font-size:.78rem;margin-bottom:5px}input,select{width:100%;padding:12px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:#0a2426;color:#fff;font:inherit}input[type=color]{padding:3px;height:46px}button{border:0;border-radius:12px;padding:13px 15px;background:var(--accent);color:#102020;font-weight:900;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.result{margin-top:13px;padding:12px;border-radius:12px;background:#0a2426;word-break:break-all}.result a{color:#f0cf83}.small{font-size:.8rem;color:#91a5a1}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main class="wrap"><div class="brand">FTS.LU · SELFIE EVENT MANAGER</div><h1>Event anlegen</h1>
<section class="card"><h2>1. Admin-Code</h2><label>Admin-Code</label><input id="adminCode" type="password" autocomplete="off"><div class="small">Bleibt ausschließlich bei FTS.</div></section>
<section class="card"><h2>2. Kunde</h2><div class="grid"><div><label>Gespeicherter Kunde</label><select id="savedCustomers"><option value="">— auswählen —</option></select></div><div><label>Aktueller Kunden-Token</label><input id="customerToken" value="c_cFrwUCPChVioLwK-J1IoARpc"></div><div class="full"><label>Neuen Kunden anlegen</label><input id="newCustomerName" placeholder="z. B. Veranstalter Mustermann"></div></div><div class="actions"><button id="createCustomer">Neuen Kunden erstellen</button><button id="saveExisting">Token lokal speichern</button></div><div id="customerResult" class="result" style="display:none"></div></section>
<section class="card"><h2>3. Neues Event</h2><div class="grid"><div><label>Eventname</label><input id="title" value="Outbeat Party"></div><div><label>Untertitel</label><input id="subtitle" placeholder="optional"></div><div><label>Datum</label><input id="eventDate" type="date" value="2026-09-12"></div><div><label>Ort</label><input id="location" value="Baustert"></div><div class="full"><label>Text auf Event-Foto</label><input id="overlay" value="Outbeat Party 2026"></div><div><label>Akzentfarbe</label><input id="accent" type="color" value="#d9b56d"></div><div><label>Hintergrund 1</label><input id="bg1" type="color" value="#071315"></div><div><label>Hintergrund 2</label><input id="bg2" type="color" value="#10383a"></div><div><label>Sichtbar für Kunde (Tage)</label><input id="days" type="number" min="1" max="30" value="3"></div></div><div class="actions"><button id="createEvent">Event jetzt erstellen</button></div><div id="eventResult" class="result" style="display:none"></div></section>
</main>
<script src="./config.js"></script>
<script>
const cfg=window.FTS_CONFIG,LS='fts_selfie_customers_v1';
function H(){return {'apikey':cfg.publishableKey,'Authorization':'Bearer '+cfg.publishableKey,'Content-Type':'application/json'}}
async function rpc(n,b){const r=await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${n}`,{method:'POST',headers:H(),body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
function saved(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch{return[]}}function setSaved(x){localStorage.setItem(LS,JSON.stringify(x));render()}function render(){const s=document.getElementById('savedCustomers'),a=saved();s.innerHTML='<option value="">— auswählen —</option>'+a.map(x=>`<option value="${x.token}">${esc(x.name)}</option>`).join('')}function saveCustomer(n,t){let a=saved().filter(x=>x.token!==t);a.unshift({name:n,token:t});setSaved(a);document.getElementById('customerToken').value=t}
document.getElementById('savedCustomers').onchange=e=>{if(e.target.value)document.getElementById('customerToken').value=e.target.value};
document.getElementById('saveExisting').onclick=()=>{const t=document.getElementById('customerToken').value.trim();if(!t)return alert('Kunden-Token fehlt');saveCustomer(prompt('Name für diesen Kunden?')||'Kunde',t)};
document.getElementById('createCustomer').onclick=async()=>{try{const c=document.getElementById('adminCode').value.trim(),n=document.getElementById('newCustomerName').value.trim();const d=await rpc('fts_admin_create_customer',{p_admin_code:c,p_name:n}),r=d[0];saveCustomer(r.customer_name,r.customer_token);const link=cfg.baseUrl+'customer.html?c='+encodeURIComponent(r.customer_token);const b=document.getElementById('customerResult');b.style.display='block';b.innerHTML=`<b>Kunde erstellt.</b><br>Kundenlink:<br><a href="${link}" target="_blank">${link}</a>`}catch(e){alert(e.message)}};
document.getElementById('createEvent').onclick=async()=>{try{const args={p_admin_code:document.getElementById('adminCode').value.trim(),p_customer_token:document.getElementById('customerToken').value.trim(),p_title:document.getElementById('title').value.trim(),p_subtitle:document.getElementById('subtitle').value.trim(),p_event_date:document.getElementById('eventDate').value,p_location:document.getElementById('location').value.trim(),p_overlay_text:document.getElementById('overlay').value.trim(),p_accent:document.getElementById('accent').value,p_bg1:document.getElementById('bg1').value,p_bg2:document.getElementById('bg2').value,p_retention_days:Number(document.getElementById('days').value||3)};const d=await rpc('fts_admin_create_event',args),r=d[0];const guest=cfg.baseUrl+'?e='+encodeURIComponent(r.event_token),poster=cfg.baseUrl+'poster.html?e='+encodeURIComponent(r.event_token),customer=cfg.baseUrl+'customer.html?c='+encodeURIComponent(args.p_customer_token);const b=document.getElementById('eventResult');b.style.display='block';b.innerHTML=`<b>Event erstellt.</b><br><br><b>Gast-/QR-Link:</b><br><a href="${guest}" target="_blank">${guest}</a><br><br><b>QR-Poster:</b><br><a href="${poster}" target="_blank">${poster}</a><br><br><b>Kundenlink – bleibt für alle Events dieses Kunden gleich:</b><br><a href="${customer}" target="_blank">${customer}</a><br><br><b>Sichtbar bis:</b> ${new Date(r.expires_at).toLocaleString('de-DE')}`}catch(e){alert(e.message)}};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
