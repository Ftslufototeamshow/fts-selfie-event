name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.54-manual-printer-events.zip
            dist/FTS-Printer-macOS-v0.3.54-manual-printer-events.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.54-manual-printer-events"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.54-manual-printer-events.zip dist/FTS-Printer-macOS-v0.3.54-manual-printer-events.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.54-manual-printer-events.zip dist/FTS-Printer-macOS-v0.3.54-manual-printer-events.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.54 · Manual Printer Events" --notes "Build 144: Ergänzt echte manuelle Printer-only-Events als zweiten Eventweg neben MySelfie, ohne den vorhandenen Produktionsweg zu duplizieren. MySelfie-Events bleiben geschützt und übernehmen weiterhin ihr studio_config unverändert. Administratoren können direkt im Printer ein manuelles Event anlegen, bearbeiten, duplizieren und archivieren. Der manuelle Editor schreibt dieselbe studio_config-Struktur, die ProductionRendererV76 bereits verwendet: fester 148x15-mm-Balken, Farbe/Verlauf, Transparenz, Titel, Untertitel, dritte Zeile, Datum, zentrale Schriftarten, Schriftgröße/-stärke/-farbe, Ausrichtung, optionales lokales Logo und FTS-Branding. Typografie ist jetzt zentral definiert und wird vom Renderer und Editor gemeinsam verwendet. SD-A-Z, WLAN, Canon SELPHY, Material, Archiv, QR, Green Screen, Filter, Druckwarteschlange und Kamera-Original bleiben unverändert. Manuelle Events laufen als operation_mode=print_only mit local_camera_photos=true durch denselben vorhandenen Backend-/Druckweg."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.54-manual-printer-events"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
