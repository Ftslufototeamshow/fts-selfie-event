name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.39-archive-local-reconcile.zip
            dist/FTS-Printer-macOS-v0.3.39-archive-local-reconcile.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.39-archive-local-reconcile"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.39-archive-local-reconcile.zip dist/FTS-Printer-macOS-v0.3.39-archive-local-reconcile.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.39-archive-local-reconcile.zip dist/FTS-Printer-macOS-v0.3.39-archive-local-reconcile.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.39 · Archive Local Reconcile" --notes "Build 129: Kleiner gezielter Archiv-Fix. Lokale Job-IDs werden bei Abholung als UUID statt als case-sensitive Text verglichen. Bereits serverseitig archivierte LOCAL-Aufträge werden beim Refresh automatisch in der lokalen Queue auf ARCHIVED nachgezogen und vorhandene Mediendateien nach Archiv/Abgegeben synchronisiert. Archivvorschau und Nachdruck dürfen bei einem serverseitig bestätigten Archiv-Eintrag zusätzlich auf die vorhandene lokale Jobdatei zurückfallen, auch wenn ein alter lokaler Status noch nicht synchron war. Canon-Spooler, Druckpfad, Spiegelkorrektur, SD/WLAN, Material, QR, Remote-Admin und sonstige Build-128-Funktionen bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.39-archive-local-reconcile"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
