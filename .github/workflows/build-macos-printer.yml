name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.29-border-safearea-fix.zip
            dist/FTS-Printer-macOS-v0.3.29-border-safearea-fix.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.29-border-safearea-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.29-border-safearea-fix.zip dist/FTS-Printer-macOS-v0.3.29-border-safearea-fix.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.29-border-safearea-fix.zip dist/FTS-Printer-macOS-v0.3.29-border-safearea-fix.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.29 · Border + Safe Area Fix" --notes "Build 119: Korrigiert ausschließlich den lokalen SD/WLAN-Renderweg vor dem unveränderten Canon-Druckpfad. Farbrand und weißer Rand erhalten eine 2-mm-Sicherheitsreserve, damit der gewählte Rahmen trotz des bestehenden 1,8-%-Randlos-Bleeds auf allen vier Seiten klar sichtbar bleibt. Lokale Druckaufträge werden beim bestätigten Druck aus dem Originalfoto mit dem aktuellen Veranstalter-Design neu gerendert statt eine ältere designedPath-Datei wiederzuverwenden. Die generierte Banner-Schrift bekommt eine deutlich strengere Safe Area und einen begrenzten Textblock; fertige hochgeladene Banner bleiben unverändert. Canon-Spooler, SELPHY-Spiegelkorrektur, Druckererkennung, SD A–E, Mehrdrucker-Verteilung, OK-zum-Druck und Archiv bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.29-border-safearea-fix"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
