name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.38-dynamic-fleet-media.zip
            dist/FTS-Printer-macOS-v0.3.38-dynamic-fleet-media.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.38-dynamic-fleet-media"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.38-dynamic-fleet-media.zip dist/FTS-Printer-macOS-v0.3.38-dynamic-fleet-media.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.38-dynamic-fleet-media.zip dist/FTS-Printer-macOS-v0.3.38-dynamic-fleet-media.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.38 · Dynamic Fleet + Media" --notes "Build 128: Finalisiert die dynamische Event-Arbeitsoberfläche ohne Änderung des bewährten Canon-Druckpfads. Oben und in SD/WLAN werden beliebig viele aktuell erreichbare Canon-Drucker dynamisch angezeigt, jeweils mit USB/WLAN-Verbindung sowie eigenem RP-108-, Papier- und Filmstand. Aktive SD-/WLAN-Quellen erscheinen als horizontale Reihe; Fotos der gewählten Quelle sind horizontal scrollbar. Fotos bleiben während Warteschlange/Druck und nach erfolgreichem Druck noch 30 Minuten als fertig sichtbar und verschwinden danach automatisch aus der Arbeitsansicht; die bestehende Archivdatei bleibt erhalten. Außerhalb der Druckauftrags-/Printer-Seiten erscheinen pro aktivem Drucker kleine Live-Druckfenster mit Foto, Restzeit und Warteschlange. Archiv-Nachdruck unterstützt 1–20 Exemplare. Canon-Spooler, Spiegelkorrektur, Druckrendering, RP-108-Verbrauch, QR, Remote-Admin, Archivdateien und SD-Importlogik bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.38-dynamic-fleet-media"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
