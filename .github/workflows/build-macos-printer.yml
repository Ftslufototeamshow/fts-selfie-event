name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.19-manual-sd-recovery.zip
            dist/FTS-Printer-macOS-v0.3.19-manual-sd-recovery.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.19-manual-sd-recovery"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.19-manual-sd-recovery.zip dist/FTS-Printer-macOS-v0.3.19-manual-sd-recovery.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.19-manual-sd-recovery.zip dist/FTS-Printer-macOS-v0.3.19-manual-sd-recovery.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.19 · Manual SD Recovery" --notes "Build 109: Ergänzt einen manuellen Rettungsweg für SD-Karten. Über „Alte Fotos auf SD suchen“ können alle unterstützten Fotos einer aktuell eingesteckten, zugeordneten Karte als Vorschau geöffnet und einzeln wieder in die aktive Fotoauswahl geholt werden. Bereits früher importierte/abgegebene Fotos werden dabei bewusst reaktiviert und erhalten ein neues Druckdesign; noch nie importierte alte Fotos werden gezielt kopiert. Der automatische SD-Import, Drucker, Archiv und übrige Oberfläche bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.19-manual-sd-recovery"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
