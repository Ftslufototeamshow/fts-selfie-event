name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.20-ippusb-print-fix.zip
            dist/FTS-Printer-macOS-v0.3.20-ippusb-print-fix.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.20-ippusb-print-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.20-ippusb-print-fix.zip dist/FTS-Printer-macOS-v0.3.20-ippusb-print-fix.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.20-ippusb-print-fix.zip dist/FTS-Printer-macOS-v0.3.20-ippusb-print-fix.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.20 · IPP-USB Print Fix" --notes "Build 110: Repariert die Canon-SELPHY-Erkennung für macOS IPP-over-USB. ippusb:// bzw. lokale IPP-USB-Verbindungen werden über den tatsächlich erreichbaren lokalen Dienst geprüft und nicht mehr nur über den Gerätenamen in ioreg. Wenn genau ein live erreichbarer SELPHY vorhanden ist, wird er automatisch als Ausgabedrucker aktiviert, auch wenn macOS die Warteschlange als „Canon SELPHY CP1500 2“ neu angelegt hat. Die Druckauftragsseite zeigt die SELPHY-Grafik, Verbindung/Fehler direkt sichtbar und bei lokalen SD-Aufträgen zusätzlich das zugehörige Druckfoto als Vorschau. SD-Import, Archiv und Design bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.20-ippusb-print-fix"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
