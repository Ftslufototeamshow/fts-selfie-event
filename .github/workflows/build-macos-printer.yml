name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.49-green-ui-layout-fix.zip
            dist/FTS-Printer-macOS-v0.3.49-green-ui-layout-fix.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.49-green-ui-layout-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.49-green-ui-layout-fix.zip dist/FTS-Printer-macOS-v0.3.49-green-ui-layout-fix.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.49-green-ui-layout-fix.zip dist/FTS-Printer-macOS-v0.3.49-green-ui-layout-fix.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.49 · Green UI Layout Fix" --notes "Build 139: Repariert die Green-Screen-Bibliothek auf kleinen und normalen MacBook-Fenstern. Die Bild/GIF-Vorschau ist jetzt layout-neutral und komplett nicht-interaktiv, sodass sie keine Buttons oder Segmentfelder mehr überdecken kann. Farbe, Bild/GIF, Comic-Burst, Feuerwerk, Hintergrund aus, Bilder hinzufügen, Aktivieren und Löschen bleiben anklickbar. Die linke FTS-Navigation ist wieder fest 220 px breit und kann von großen Hintergrundbildern nicht mehr aus dem Fenster gedrückt werden; der Inhaltsbereich wird sauber auf die verfügbare Fensterbreite begrenzt. Hintergrundbilder werden in der Einstellungsansicht vollständig proportional angezeigt und nicht abgeschnitten. Mehrfach-Hintergründe, manuelle Auswahl, Tageskennzeichnung und GIF-Vorschau aus Build 138 bleiben erhalten. Kamera Original bleibt unverändert; Green Screen bleibt nur Vorschau-/Druckebene. Canon-Spooler, SD-A-Z, Material, Archiv, QR und 148x15-mm-Banner bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.49-green-ui-layout-fix"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
