name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.9-card-readonly.zip
            dist/FTS-Printer-macOS-v0.3.9-card-readonly.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.9-card-readonly"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.9-card-readonly.zip dist/FTS-Printer-macOS-v0.3.9-card-readonly.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.9-card-readonly.zip dist/FTS-Printer-macOS-v0.3.9-card-readonly.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.9 · Read-Only SD Cards" --notes "Build 99: FTS schreibt keine Registrierungsdatei mehr auf SD-/USB-Karten. A/B/C/D/E wird ausschließlich lokal auf dem Mac gespeichert; vorhandene alte Kartenmarker werden nur noch gelesen. Karten dürfen read-only sein. Der Recovery-Import übernimmt weiterhin neue bzw. zuvor verschluckte Fotos und verhindert echte Duplikate per SHA-256. Orientation-Fix, WLAN/AirPrint und Postcard-fullbleed bleiben erhalten."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.9-card-readonly"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
