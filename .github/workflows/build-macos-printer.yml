name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.34-archive-recall.zip
            dist/FTS-Printer-macOS-v0.3.34-archive-recall.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.34-archive-recall"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.34-archive-recall.zip dist/FTS-Printer-macOS-v0.3.34-archive-recall.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.34-archive-recall.zip dist/FTS-Printer-macOS-v0.3.34-archive-recall.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.34 · Archive Recall" --notes "Build 124: Macht abgeholte/archivierte Fotos direkt in Kundenabholung sichtbar und durchsuchbar. Archivierte Selfies laden ihre gespeicherte Druckdatei aus Supabase; lokale SD/WLAN-Aufträge verwenden die unveränderten Dateien aus Archiv/Abgegeben bzw. Kamera Original. Ein Archivfoto kann groß angesehen und mit '1× nachdrucken' als neuer, normal gezählter lokaler Auftrag angelegt werden; der alte Archiv-Eintrag und das Original bleiben unverändert. Die Archivliste wurde auf 500 Einträge erweitert. Canon-Druckpfad, SELPHY-Spiegelkorrektur, Materialzähler, SD A–E, Mehrdrucker-Verteilung und Banner/Rand bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.34-archive-recall"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
