name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.52-lime-green-detection.zip
            dist/FTS-Printer-macOS-v0.3.52-lime-green-detection.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.52-lime-green-detection"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.52-lime-green-detection.zip dist/FTS-Printer-macOS-v0.3.52-lime-green-detection.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.52-lime-green-detection.zip dist/FTS-Printer-macOS-v0.3.52-lime-green-detection.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.52 · Lime Green Detection" --notes "Build 142: Korrigiert die echte Green-Screen-Erkennung für helle Lime-/Gelbgrün-Wände unter Eventlicht. Der praktische Chroma-Hue-Bereich wurde erweitert, während die Schutzlogik gegen Wiese, grüne Kleidung und kleine grüne Flächen unverändert bleibt: Ersatz erfolgt nur bei einer großen zusammenhängenden Hintergrundfläche mit ausreichender Bildspannweite, oberen Bildanteilen und Hintergrundgeometrie. Kleine SD/WLAN-Vorschau, große Druckvorschau und physischer Druck teilen weiterhin dieselbe gecachte Entscheidung pro Kameraoriginal. Kamera Original bleibt unverändert. Hintergrundbibliothek bleibt Aspect-Fit; Druckhintergrund bleibt proportional zentriertes Aspect-Fill. Canon, SD-A-Z, WLAN, Material, Archiv, QR, Filter, Eventtag und 148x15-mm-Banner bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.52-lime-green-detection"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
