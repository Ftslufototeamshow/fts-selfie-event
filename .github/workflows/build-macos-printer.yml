name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.22-fast-sd-auto-dispatch.zip
            dist/FTS-Printer-macOS-v0.3.22-fast-sd-auto-dispatch.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.22-fast-sd-auto-dispatch"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.22-fast-sd-auto-dispatch.zip dist/FTS-Printer-macOS-v0.3.22-fast-sd-auto-dispatch.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.22-fast-sd-auto-dispatch.zip dist/FTS-Printer-macOS-v0.3.22-fast-sd-auto-dispatch.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.22 · Fast SD + Auto Dispatch" --notes "Build 112: Beschleunigt ausschließlich den SD-Leseweg und die Bedienung vor dem bestehenden Druckpfad. Bekannte Kartendateien werden nicht mehr bei jedem Scan erneut per EXIF und SHA-256 geöffnet; beim Kartenlernen werden nur schnelle Dateischlüssel aufgebaut und nur eine kleine Stichprobe gehasht. Bekannte DCIM-Karten vermeiden zusätzliche Vollscans/Signaturarbeit, und der automatische SD-Scan läuft im 1-Sekunden-Takt. Bei aktiver Automatik wird eine gewählte Druckmenge nach 1,2 Sekunden ohne weiteren GO-Klick automatisch als lokaler Auftrag angelegt und anschließend von der bereits vorhandenen Mehrdrucker-Verteilung auf alle freien, aktivierten Drucker verteilt. Der native Canon-Druckpfad aus Build 111 bleibt unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.22-fast-sd-auto-dispatch"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
