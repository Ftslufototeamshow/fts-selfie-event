name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.18-sd-hardware-fix.zip
            dist/FTS-Printer-macOS-v0.3.18-sd-hardware-fix.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.18-sd-hardware-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.18-sd-hardware-fix.zip dist/FTS-Printer-macOS-v0.3.18-sd-hardware-fix.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.18-sd-hardware-fix.zip dist/FTS-Printer-macOS-v0.3.18-sd-hardware-fix.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.18 · SD Hardware Fix" --notes "Build 108: Repariert die SD-Hardwareerkennung. Gemountete Installer-/DMG-Volumes werden nicht mehr als SD-Karten angezeigt; echte physische Wechselmedien, DCIM-Karten und Datenträger mit Kamera-Fotos werden erkannt. Bereits registrierte Karten A-E werden bei geänderter Volume-ID über gespeicherte Foto-Fingerprints/Baselines wiedererkannt. Bei mehrtägigen Events wird beim Start der heutige Eventtag vor einer gespeicherten Auswahl von gestern gewählt. Der SD-Import und die automatische Fotoanzeige aus Build 106/107 bleiben aktiv; Drucker-, Archiv- und Designlogik bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.18-sd-hardware-fix"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
