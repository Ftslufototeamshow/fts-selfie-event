name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.23-live-design-sync.zip
            dist/FTS-Printer-macOS-v0.3.23-live-design-sync.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.23-live-design-sync"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.23-live-design-sync.zip dist/FTS-Printer-macOS-v0.3.23-live-design-sync.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.23-live-design-sync.zip dist/FTS-Printer-macOS-v0.3.23-live-design-sync.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.23 · Live Design Sync" --notes "Build 113: Repariert ausschließlich die Live-Synchronisation des Veranstalter-/Studio-Designs für lokale SD-/WLAN-Fotos. Die Mac-App lädt die aktuelle Event-/studio_config regelmäßig neu statt ein beim Öffnen eingefrorenes Event-Objekt zu verwenden. Änderungen wie Bannerbild hinzufügen/entfernen, Text, Farben, Logos oder Studio-Einstellungen ändern dadurch automatisch die Design-Signatur und rendern aktive sowie bereits wartende lokale Druckdateien neu. Ein zusätzlicher Button „Veranstalter-Design aktualisieren“ erzwingt die Synchronisation sofort. Bereits produzierte/abgegebene/fehlgeschlagene Historie bleibt unverändert. SD-Geschwindigkeit, Auto-Dispatch und der funktionierende Canon-Druckpfad bleiben unangetastet."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.23-live-design-sync"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
