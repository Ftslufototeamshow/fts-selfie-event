name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.36-admin-misprint-staff-report.zip
            dist/FTS-Printer-macOS-v0.3.36-admin-misprint-staff-report.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.36-admin-misprint-staff-report"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.36-admin-misprint-staff-report.zip dist/FTS-Printer-macOS-v0.3.36-admin-misprint-staff-report.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.36-admin-misprint-staff-report.zip dist/FTS-Printer-macOS-v0.3.36-admin-misprint-staff-report.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.36 · Admin Misprint + Staff Report" --notes "Build 126: Ergänzt eine administratorgeschützte Fehldruck-/Ersatzdruck-Funktion und eine nur für Administratoren sichtbare Mitarbeiter-Tagesleistung. Bei UNCERTAIN kann ein Administrator mit persönlichem Code entweder 'gar nicht gedruckt' bestätigen und sicher erneut freigeben oder einen tatsächlich unbrauchbaren physischen Druck als Fehldruck deklarieren. Für bereits produzierte Aufträge gibt es in Kundenabholung 'Fehldruck / Ersatz'. Gründe wie Farbfehler, Papierstau, Teildruck, Stromausfall und beschädigtes Papier werden protokolliert; genau ein Ersatzdruck wird freigegeben und der Kunde wird nicht erneut berechnet. Die Tagesliste zeigt lokale, Selfie- und gesamte physische Prints, gute Prints, Fehldrucke, Ersatzdrucke und Admin-Freigaben pro Mitarbeiter. Canon-Spooler, Spiegelkorrektur, Material-/RP-108-Zähler, SD A-E, QR-Download, Archiv, Banner/Rand und der bestehende Druckpfad bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.36-admin-misprint-staff-report"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
