name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.26-photo-preview-confirm.zip
            dist/FTS-Printer-macOS-v0.3.26-photo-preview-confirm.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.26-photo-preview-confirm"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.26-photo-preview-confirm.zip dist/FTS-Printer-macOS-v0.3.26-photo-preview-confirm.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.26-photo-preview-confirm.zip dist/FTS-Printer-macOS-v0.3.26-photo-preview-confirm.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.26 · Photo Preview + Confirm" --notes "Build 116: Ergänzt eine große Druckvorschau pro SD-/WLAN-Foto und stellt das manuelle Bestätigen vor dem Druck wieder her. Ein Klick auf das Vorschaubild öffnet die fertige Druckdatei groß. Dort können Randlos, weißer Rand oder Farbrand, Randbreite, Randfarbe sowie Bild füllen oder Einpassen gewählt und die Stückzahl 1–20 festgelegt werden. Erst „OK · Zum Druck“ legt den Auftrag an; die Mengenwahl allein startet keinen Druck mehr. Die zuletzt gewählte Rand-/Einpass-Einstellung wird pro Event gespeichert. Die bestehende Warteschlange, Mehrdrucker-Verteilung, Canon-Druckerkennung, SELPHY-Spiegelkorrektur, SD-Geschwindigkeit und Live-Design-Synchronisation bleiben unverändert; der neue Rahmen wird nur auf die bereits fertige Druckdatei angewendet."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.26-photo-preview-confirm"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
