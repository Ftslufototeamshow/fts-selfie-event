name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.58-frame-safe.zip
            dist/FTS-Printer-macOS-v0.3.58-frame-safe.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.58-frame-safe"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.58-frame-safe.zip dist/FTS-Printer-macOS-v0.3.58-frame-safe.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.58-frame-safe.zip dist/FTS-Printer-macOS-v0.3.58-frame-safe.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.58 · Rahmen-Fix" --notes "Build 148: Fixiert den sichtbaren weißen oder farbigen Druckrahmen bei lokalen Kamera-, SD-, WLAN- und USB-Fotos. Wenn ein Rahmen gewählt ist, wird die fertig komponierte Seite im letzten Canon-SELPHY-Druckschritt nicht mehr mit dem 1,8-%-Borderless-Overscan vergrößert, sondern vollständig und mit kleiner Sicherheitsreserve in die Postcard-Fläche eingepasst. Dadurch bleiben oben, unten, links und rechts sichtbar. Der bestehende rahmenlose Druckpfad, Green Screen, USB-Kamera, SD/WLAN, Vorschau, Archiv, Material, QR, Remote-Admin und die Druckwarteschlange bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.58-frame-safe"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
