name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.11-finder-cards.zip
            dist/FTS-Printer-macOS-v0.3.11-finder-cards.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.11-finder-cards"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.11-finder-cards.zip dist/FTS-Printer-macOS-v0.3.11-finder-cards.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.11-finder-cards.zip dist/FTS-Printer-macOS-v0.3.11-finder-cards.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.11 · Finder-visible SD/USB Cards" --notes "Build 101: Erkannte SD-/USB-Karten bleiben gleichzeitig im FTS-System und im Finder nutzbar. Jede Karte zeigt nun beschreibbar/schreibgeschützt an und kann direkt über „Im Finder öffnen“ geöffnet werden. Zusätzlich kann FTS die Finder-Einstellung für externe/removable Medien auf dem Desktop aktivieren. FTS hängt Karten nicht aus und übernimmt sie nicht exklusiv. Die lokale A-E-Erkennung, inkrementeller SHA-256-Import, stabilerer Updater sowie der kompakte Hochkant-Banner aus Build 100 bleiben erhalten."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.11-finder-cards"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
