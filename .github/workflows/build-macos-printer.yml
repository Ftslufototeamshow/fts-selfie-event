name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.14-live-device-panel.zip
            dist/FTS-Printer-macOS-v0.3.14-live-device-panel.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.14-live-device-panel"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.14-live-device-panel.zip dist/FTS-Printer-macOS-v0.3.14-live-device-panel.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.14-live-device-panel.zip dist/FTS-Printer-macOS-v0.3.14-live-device-panel.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.14 · Live Device Panel" --notes "Build 104: Neues kompaktes Live-Gerätepanel für Canon SELPHY, WLAN-Kamera und SD-Karten. Nur tatsächlich verbundene/relevante Geräte werden angezeigt. Unbekannte SD-Karten bieten nur freie A-E-Zuordnungen an; registrierte Karten erscheinen als kompakte FTS-SD-Karte mit Importstatus. WLAN-Kameras werden aus echten Foto-Metadaten benannt und zeigen eine fünfstufige Verbindungsanzeige. Die Fotoübersicht ist deutlich kompakter, neu eingegangene Fotos stehen vorne und jedes Foto erhält eine stabile Nummer pro Quelle. Zusätzlich ist das freigegebene FTS-Bild jetzt als echtes macOS-App-Icon (Finder/Dock/App) im Bundle hinterlegt."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.14-live-device-panel"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
