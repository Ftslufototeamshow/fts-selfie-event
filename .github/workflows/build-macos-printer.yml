name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.55-text-designer.zip
            dist/FTS-Printer-macOS-v0.3.55-text-designer.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.55-text-designer"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.55-text-designer.zip dist/FTS-Printer-macOS-v0.3.55-text-designer.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.55-text-designer.zip dist/FTS-Printer-macOS-v0.3.55-text-designer.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.55 · Text Designer" --notes "Build 145: Erweitert den gemeinsamen FTS-Fotodesigner für manuelle Printer-Events und das Selfie-Studio. Der 148-mm-Balken bleibt maximal 15 mm hoch, kann nun aber zwischen 6 und 15 mm kleiner eingestellt werden. Abstand Titel-Unteritel und Untertitel-Zeile 3 ist numerisch einstellbar. Titel, Untertitel und dritte Zeile erhalten jeweils unabhängig über 20 gemeinsame Schriftarten, frei wählbare Grundfarbe, Buchstaben-Farbmodus (einfarbig, jeder Buchstabe, je 2 oder je 3 Buchstaben), sechs frei wählbare Palettenfarben sowie optionale Kontur/Außenfarbe mit Stärke. Größe ist zusätzlich numerisch editierbar. ProductionRendererV76 und Web-Fotoengine verwenden dieselben studio_config-Felder; bestehende MySelfie- und manuelle Events bleiben rückwärtskompatibel. Canon, SD-A-Z, WLAN, Green Screen, Material, Archiv, QR, Druckwarteschlange und Kamera-Original bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.55-text-designer"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
