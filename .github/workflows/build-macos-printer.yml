name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.37-mobile-admin-remote-control.zip
            dist/FTS-Printer-macOS-v0.3.37-mobile-admin-remote-control.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.37-mobile-admin-remote-control"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.37-mobile-admin-remote-control.zip dist/FTS-Printer-macOS-v0.3.37-mobile-admin-remote-control.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.37-mobile-admin-remote-control.zip dist/FTS-Printer-macOS-v0.3.37-mobile-admin-remote-control.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.37 · Mobile Admin Remote Control" --notes "Build 127: Ergänzt ausschließlich Fernübersicht und Admin-Kommunikation. Jede Printer-Station sendet einen Live-Heartbeat pro ausgewähltem Event mit angemeldetem Mitarbeiter, Login-Zeit, Mac-Strom/Akku, Netzwerk, Druckerstatus, lokalem SD/WLAN-Status, Foto-Dateinamen/Workflow und lokaler Queue. Druckprobleme können ohne Admin vor Ort an die installierbare FTS Printer Admin Web-App gesendet werden; der Administrator kann remote 1× Ersatz, 'gar nicht gedruckt' oder Ablehnung freigeben und eine kurze Nachricht schreiben. Der Mac übernimmt bestätigte Freigaben sicher und zeigt sie über einen runden Chat-Button; Mitarbeiter kann 'Ist okay', 'Problem besteht noch' oder kurzen Text zurückmelden. Mehrere Events/Computer bleiben getrennt über Event- und Geräte-IDs. Canon-Spooler, SELPHY-Spiegelkorrektur, Druckrendering, Material/RP-108, SD A-E, QR-Download, Archiv, Banner/Rand und bestehender Druckpfad bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.37-mobile-admin-remote-control"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
