name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.45-updater-version-fix.zip
            dist/FTS-Printer-macOS-v0.3.45-updater-version-fix.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.45-updater-version-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.45-updater-version-fix.zip dist/FTS-Printer-macOS-v0.3.45-updater-version-fix.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.45-updater-version-fix.zip dist/FTS-Printer-macOS-v0.3.45-updater-version-fix.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.45 · Updater Version Fix" --notes "Build 135: Repariert die Versions- und Build-Erkennung des Auto-Updaters. Die App liest Version und Build jetzt direkt aus Info.plist statt aus alten fest codierten Werten 0.3.41 / Build 131. Dadurch zeigt die Oberfläche nach dem Update die tatsächlich installierte Version und bietet ein bereits installiertes Update nicht erneut an. Alle Funktionen aus Build 134 bleiben unverändert: SD-Karten A-Z Fix, sicherer Foto-Renderer mit Neurendering aktiver Designs, Green Screen, Filter/Comic, Canon-Spooler, Spiegelkorrektur, Materiallogik, Archiv, QR und 148x15-mm-Banner."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.45-updater-version-fix"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
