name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.27-photo-crop-safe-banner.zip
            dist/FTS-Printer-macOS-v0.3.27-photo-crop-safe-banner.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.27-photo-crop-safe-banner"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.27-photo-crop-safe-banner.zip dist/FTS-Printer-macOS-v0.3.27-photo-crop-safe-banner.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.27-photo-crop-safe-banner.zip dist/FTS-Printer-macOS-v0.3.27-photo-crop-safe-banner.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.27 · Photo Crop + Safe Banner" --notes "Build 117: Vervollständigt die Druckvorschau: Das Foto kann jetzt in der großen Vorschau gezoomt und per Ziehen im Ausschnitt verschoben werden; derselbe Crop wird erst beim bestätigten Druck mit dem aktuellen Veranstalter-Design neu gerendert. Die untere FTS-Bannerhöhe ist physisch auf 15 mm bezogen auf die 100-mm-Postcard-Seite fixiert (Querformat 15 %, Hochformat 10 % im bestehenden 3:2-Raster). Text, Logos und Dekorationen erhalten eine feste Druck-Sicherheitszone; Text wird innerhalb sicherer Bannerbereiche verkleinert statt abgeschnitten. Randlos/weißer Rand/Farbrand, Randbreite, Randfarbe und die explizite OK-zum-Druck-Logik bleiben erhalten. Canon-SELPHY-Spiegelkorrektur, Druckererkennung, Mehrdrucker-Verteilung, SD A–E, Archivworkflow und Live-Design-Sync bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.27-photo-crop-safe-banner"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
