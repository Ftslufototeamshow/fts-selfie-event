name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.41-card-material-controls.zip
            dist/FTS-Printer-macOS-v0.3.41-card-material-controls.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.41-card-material-controls"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.41-card-material-controls.zip dist/FTS-Printer-macOS-v0.3.41-card-material-controls.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.41-card-material-controls.zip dist/FTS-Printer-macOS-v0.3.41-card-material-controls.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.41 · Card + Material Controls" --notes "Build 131: Stellt die SD-Karten-Zuordnung A–Z wieder her und trennt aktive Kartenreservierungen von historischen Baselines. Belegte Kennungen bleiben sichtbar und können bei einer formatierten/neuen Karte gezielt neu vergeben werden; bei eindeutig erkannter frischer Kartengeneration wird die alte aktive Zuordnung lokal freigegeben. FTS schreibt weiterhin nichts auf Kamera-SD-Karten. Pro Canon-Drucker bleiben Papier 18, Farbfilm 54 und RP-108 108 getrennt; neu ist Restbestand ändern 0–108/0–18/0–54 für angebrochene Sets, z. B. RP-108 auf 102. Bei leerem Material erscheint programmweit eine Meldung pro Drucker mit direkter Bestätigung für Papier/Farbfilm/RP-108; danach kann die vorhandene Warteschlange automatisch weiterlaufen. Canon-Spooler, Spiegelkorrektur, Druckrendering, Archiv, QR, Remote-Admin, Live-Druckfenster und bestehende Drucklogik bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.41-card-material-controls"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
