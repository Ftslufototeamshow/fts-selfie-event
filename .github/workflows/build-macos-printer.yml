name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.32-material-resume.zip
            dist/FTS-Printer-macOS-v0.3.32-material-resume.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.32-material-resume"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.32-material-resume.zip dist/FTS-Printer-macOS-v0.3.32-material-resume.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.32-material-resume.zip dist/FTS-Printer-macOS-v0.3.32-material-resume.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.32 · Material Resume" --notes "Build 122: Behebt ausschließlich die Materialwechsel-/Weiterdruck-Logik. Nach bestätigtem Papierwechsel (18 Blatt) oder Farbfilmwechsel (54 Prints) wird ein freier Drucker wieder auf Bereit gesetzt, macOS neu erkannt, die Materialwerte aktualisiert und wartende Jobs bei aktiver Automatik sofort weitergeschickt. Zusätzlich gibt es einen Button 'Material gewechselt · Weiterdrucken'. Wenn macOS nach einer Materialpause wieder IDLE meldet, kann ein freier ERROR-Slot automatisch zurück auf IDLE gehen. Ein Auftrag mit unklarem/aktuellem Druckstatus wird ausdrücklich nicht automatisch freigegeben, damit keine Doppelprints entstehen. Canon-Spooler, Spiegelkorrektur, SD A–E, Mehrdrucker-Verteilung, Rand-/Bannerlogik und Archiv bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.32-material-resume"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
