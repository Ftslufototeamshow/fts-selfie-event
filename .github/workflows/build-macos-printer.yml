name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.56-usb-camera-direct.zip
            dist/FTS-Printer-macOS-v0.3.56-usb-camera-direct.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.56-usb-camera-direct"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.56-usb-camera-direct.zip dist/FTS-Printer-macOS-v0.3.56-usb-camera-direct.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.56-usb-camera-direct.zip dist/FTS-Printer-macOS-v0.3.56-usb-camera-direct.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.56 · USB Camera Direct" --notes "Build 146: Ergänzt direkten USB/PTP-Kameraimport über Apples ImageCaptureCore, ohne den bestehenden Canon-Druckpfad oder SD/WLAN-Import zu verändern. Eine per Kabel erkannte Kamera wird als USB-Kamera angezeigt; bei freigegebenen Kamera-/Print-Only-Events kann das aktuelle Tagesalbum automatisch aktiviert werden. Eventrelevante neue Fotos werden read-only von der Kamera in einen lokalen USB-Eingang übertragen, anschließend in Kamera Original/USB übernommen und erscheinen als eigene Quelle USB-Kamera im bestehenden Foto-, Green-Screen-, Vorschau-, Archiv- und Druckablauf. Kamera-Dateien werden auf dem Gerät nie gelöscht. RAW+JPEG-Paare bevorzugen weiterhin JPEG/HEIC/PNG. Bestehende SD-A-Z-, WLAN-, Green-Screen-, Textdesigner-, Material-, Archiv-, QR-, Remote-Admin- und Canon-Spooler-Logik bleibt unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.56-usb-camera-direct"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
