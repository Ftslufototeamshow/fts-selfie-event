name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.35-digital-status-header.zip
            dist/FTS-Printer-macOS-v0.3.35-digital-status-header.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.35-digital-status-header"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.35-digital-status-header.zip dist/FTS-Printer-macOS-v0.3.35-digital-status-header.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.35-digital-status-header.zip dist/FTS-Printer-macOS-v0.3.35-digital-status-header.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.35 · Digital QR + Status Header" --notes "Build 125: Ergänzt ausschließlich die sichtbaren Event-Bedienfunktionen: In der großen Druckvorschau und großen Archivansicht wird automatisch ein geschützter QR-Code für das digitale Foto erzeugt; der QR ist reine UI und wird nie in das Druckbild gerendert. Der persönliche Download-Link ist 7 Tage gültig. Oben werden Login-Startzeit und laufende Login-Dauer angezeigt, der Mitarbeiter-Avatar kann per Klick gesetzt/geändert werden, und die kompakte Eventleiste zeigt Mac-Akku/Netzstrom, Drucker-Verbindung (USB/WLAN) sowie einen ehrlichen SELPHY-Akkuhinweis über das Canon-Display. Canon-Spooler, SELPHY-Spiegelkorrektur, Materialzähler, SD A-E, Mehrdrucker-Verteilung, Archiv-Nachdruck und Banner/Rand bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.35-digital-status-header"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
