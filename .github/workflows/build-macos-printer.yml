name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.51-green-detection-fit.zip
            dist/FTS-Printer-macOS-v0.3.51-green-detection-fit.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.51-green-detection-fit"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.51-green-detection-fit.zip dist/FTS-Printer-macOS-v0.3.51-green-detection-fit.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.51-green-detection-fit.zip dist/FTS-Printer-macOS-v0.3.51-green-detection-fit.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.51 · Green Detection + Fit" --notes "Build 141: Green Screen ersetzt den Hintergrund nur noch, wenn im tatsächlichen Kamerafoto eine große zusammenhängende typische Chroma-Grün-Hintergrundfläche erkannt wird. Grüne Kleidung, kleine grüne Bereiche und normale Fotos ohne echte Green-Screen-Wand lösen keinen Ersatz aus. Kleine SD/WLAN-Vorschau, große Druckvorschau und physischer Druck verwenden dieselbe gecachte Entscheidung pro unverändertem Kameraoriginal. Die Hintergrundbibliothek bleibt Aspect-Fit und zeigt das komplette Bild proportional; der fertige Druckhintergrund bleibt proportional zentriertes Aspect-Fill ohne Verzerrung. Kamera Original bleibt unverändert. Mehrfach-Hintergründe, manuelle Auswahl, GIF, Farbe, Comic-Burst, Feuerwerk, Filter/Comic pro Foto, Eventtag, SD-A-Z, WLAN, Canon SELPHY, Material, Archiv, QR, 148x15-mm-Banner und bestehendes FTS-Layout bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.51-green-detection-fit"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
