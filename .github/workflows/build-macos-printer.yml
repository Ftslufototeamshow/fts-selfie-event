name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.46-fast-sd-original-safe.zip
            dist/FTS-Printer-macOS-v0.3.46-fast-sd-original-safe.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.46-fast-sd-original-safe"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.46-fast-sd-original-safe.zip dist/FTS-Printer-macOS-v0.3.46-fast-sd-original-safe.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.46-fast-sd-original-safe.zip dist/FTS-Printer-macOS-v0.3.46-fast-sd-original-safe.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.46 · Fast SD + Original Safe" --notes "Build 136: Beschleunigt den Produktionsweg ohne das Kameraoriginal anzutasten. SD-Karten werden bei normalen Scans nur einmal vollständig enumeriert; neue Originale erscheinen sofort in der Arbeitsansicht und Druckdesigns werden separat vorbereitet. Kleine Fotoansichten zeigen immer Kamera Original. Comic/Green-Screen-Personenmasken, Gesichtserkennung sowie Banner/Logo-Dateien werden für das unveränderte Original gecacht. Die große Vorschau speichert beim OK eine separate fertige Druckvariante, die direkt an CUPS/Canon gesendet wird; Archiv-JPEG wird erst nach CUPS-Übergabe erzeugt. Der alte 0.3.41-User-Agent ist entfernt und wird aus der installierten Version/Build erzeugt. Canon-Spooler, Spiegelkorrektur, Materiallogik, A-Z-Zuordnung, QR, Archiv und 148x15-mm-Banner bleiben bestehen."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.46-fast-sd-original-safe"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
