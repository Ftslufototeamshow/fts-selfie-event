name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.10-usb-update-portrait.zip
            dist/FTS-Printer-macOS-v0.3.10-usb-update-portrait.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.10-usb-update-portrait"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.10-usb-update-portrait.zip dist/FTS-Printer-macOS-v0.3.10-usb-update-portrait.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.10-usb-update-portrait.zip dist/FTS-Printer-macOS-v0.3.10-usb-update-portrait.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.10 · USB Cards + Stable Updates + Compact Portrait" --notes "Build 100: USB-/SD-Karten werden auch dann erkannt, wenn macOS sie über einen Kartenleser nicht als removable/ejectable markiert, solange ein DCIM-Kameramedium vorhanden ist. Die lokale A-E-Erkennung erhält zusätzlich eine stabile Karten-Signatur, neue Fotos werden weiterhin per SHA-256 ohne Duplikate importiert. Der Updater prüft vorhandene Downloads und versucht fehlgeschlagene Downloads bis zu drei Mal. Hochkant-Fotos verwenden im Selfie und beim Kartenimport einen deutlich kompakteren unteren Banner mit kleinerer Schrift/Branding; Querformat bleibt unverändert. WLAN/AirPrint und Postcard-fullbleed bleiben erhalten."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.10-usb-update-portrait"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
