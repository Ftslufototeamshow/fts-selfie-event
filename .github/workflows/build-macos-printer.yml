name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.12-media-workflow.zip
            dist/FTS-Printer-macOS-v0.3.12-media-workflow.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.12-media-workflow"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.12-media-workflow.zip dist/FTS-Printer-macOS-v0.3.12-media-workflow.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.12-media-workflow.zip dist/FTS-Printer-macOS-v0.3.12-media-workflow.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.12 · Card Release + Media Workflow" --notes "Build 102: Registrierte Karten A–E können wieder freigegeben werden, ohne Fotos zu löschen. Alte FTS-Kartenmarker werden auf beschreibbaren Medien entfernt; freigegebene Karten werden lokal nicht erneut automatisch beansprucht. Lokale Fotos folgen jetzt einem sauberen Workflow: Aktiv → In Druck → Produziert → Abgegeben; verworfene/fehlgeschlagene Aufträge gehen nach Fehler. Druckdateien verlassen nach erfolgreichem Druck den Ordner Druckbereit und werden unter Archiv/Produziert, Archiv/Fehler oder Archiv/Abgegeben einsortiert. Originalfotos bleiben erhalten. Einzelne Fotos können nur aus der App-Ansicht entfernt werden, ohne Dateien zu löschen."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.12-media-workflow"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
