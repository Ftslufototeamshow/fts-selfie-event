name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.59-green-room-speed.zip
            dist/FTS-Printer-macOS-v0.3.59-green-room-speed.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.59-green-room-speed"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.59-green-room-speed.zip dist/FTS-Printer-macOS-v0.3.59-green-room-speed.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.59-green-room-speed.zip dist/FTS-Printer-macOS-v0.3.59-green-room-speed.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.59 · Green Room + Speed" --notes "Build 149: Enthält den Rahmen-Fix aus Build 148 und ergänzt zwei Green-Screen-Verbesserungen. Erstens erkennt FTS jetzt auch Event-Cubes mit klar grüner Rückwand und weißen oder neutralen Seitenwänden als Green-Screen-Raum; nach sicherer Rückwanderkennung ersetzt die Personensegmentierung den kompletten Raum außerhalb der Personen, also auch nicht-grüne Seitenwände und Boden. Zweitens arbeitet die kleine und große interaktive Vorschau schneller: Vorschauen verwenden ein begrenztes Arbeitsbild und Vision Balanced, während der physische Druck weiterhin die volle Originalauflösung und Vision Accurate verwendet. Canon-Druckpfad, SD/WLAN/USB, Archiv, Material, QR, Remote-Admin und Druckwarteschlange bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.59-green-room-speed"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
