name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.50-green-preview-fix.zip
            dist/FTS-Printer-macOS-v0.3.50-green-preview-fix.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.50-green-preview-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.50-green-preview-fix.zip dist/FTS-Printer-macOS-v0.3.50-green-preview-fix.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.50-green-preview-fix.zip dist/FTS-Printer-macOS-v0.3.50-green-preview-fix.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.50 · Green Preview Fix" --notes "Build 140: Repariert die Green-Screen-Vorschaufotos im SD-/WLAN-Arbeitsbereich. Kleine Fotokarten zeigen bei aktivem Green Screen jetzt sofort den ausgewählten Bild-, Farb-, Comic- oder Feuerwerk-Hintergrund statt weiter die grüne Wand zu zeigen. Die große Druckvorschau und der physische Druck verwenden weiterhin denselben Green-Screen-Snapshot. Kamera-Originale und der wiederverwendbare Druckbereit-Cache bleiben unverändert; es wird nur eine Vorschau erzeugt. Hintergrundwechsel aktualisieren die sichtbaren Vorschaufotos sofort. Eventtag 27.09 und manuelle Hintergrundauswahl bleiben unverändert. Canon-Spooler, SD-A-Z, Material, Archiv, QR, Filter und 148x15-mm-Banner bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.50-green-preview-fix"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
