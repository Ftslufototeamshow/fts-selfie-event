name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.30-print-path-restore.zip
            dist/FTS-Printer-macOS-v0.3.30-print-path-restore.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.30-print-path-restore"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.30-print-path-restore.zip dist/FTS-Printer-macOS-v0.3.30-print-path-restore.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.30-print-path-restore.zip dist/FTS-Printer-macOS-v0.3.30-print-path-restore.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.30 · Print Path Restore" --notes "Build 120: Stellt ausschließlich den bewährten lokalen Druck-Vorlauf aus Build 118 wieder her. Normale SD/WLAN-Aufträge verwenden wieder die bereits vorbereitete Design-Datei und erreichen dadurch den unveränderten macOS/Canon-Spooler direkt; nur ein manuell veränderter Foto-Crop wird weiterhin aus dem Original neu gerendert. Die Rand-Sicherheitsreserve und strengere Banner-Safe-Area aus Build 119 bleiben erhalten. Canon-Spooler, SELPHY-Spiegelkorrektur, Druckererkennung, SD A–E, Mehrdrucker-Verteilung, OK-zum-Druck und Archiv bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.30-print-path-restore"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
