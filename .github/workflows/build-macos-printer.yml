name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.24-selphy-mirror-fix.zip
            dist/FTS-Printer-macOS-v0.3.24-selphy-mirror-fix.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.24-selphy-mirror-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.24-selphy-mirror-fix.zip dist/FTS-Printer-macOS-v0.3.24-selphy-mirror-fix.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.24-selphy-mirror-fix.zip dist/FTS-Printer-macOS-v0.3.24-selphy-mirror-fix.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.24 · SELPHY Mirror Fix" --notes "Build 114: Korrigiert ausschließlich die horizontale Spiegelung beim nativen Canon-SELPHY-Druck. Die fertige, bereits gerenderte Druckfläche wird für SELPHY/CP1500 direkt vor der Übergabe an macOS horizontal gegengespiegelt, damit der physische Ausdruck genauso lesbar und ausgerichtet ist wie die FTS-Vorschau. Fotoimport, EXIF-Rotation, Design-Studio, Live-Design-Sync, SD-Geschwindigkeit, Auto-Dispatch, Mehrdrucker-Verteilung und Druckererkennung bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.24-selphy-mirror-fix"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
