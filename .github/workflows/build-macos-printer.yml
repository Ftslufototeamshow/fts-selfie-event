name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.13-live-printer-links.zip
            dist/FTS-Printer-macOS-v0.3.13-live-printer-links.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.13-live-printer-links"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.13-live-printer-links.zip dist/FTS-Printer-macOS-v0.3.13-live-printer-links.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.13-live-printer-links.zip dist/FTS-Printer-macOS-v0.3.13-live-printer-links.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.13 · Live Printer Connections" --notes "Build 103: FTS zeigt nur Drucker, deren USB-Verbindung physisch erkannt oder deren AirPrint/IPP-Netzwerkweg aktuell erreichbar ist. Alte/offline macOS-Warteschlangen verschwinden aus der App. WLAN zeigt Mac-RSSI, SNR, Linkrate und die TCP-Antwortzeit zum Drucker; der FTS-Server erhält eine eigene Erreichbarkeits-/Latenzanzeige. USB zeigt die ausgehandelte USB-Link-Geschwindigkeit und verfügbare Stromstärke, soweit macOS diese Werte liefert. Der Karten- und Medienarchiv-Workflow aus Build 102 bleibt erhalten."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.13-live-printer-links"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
