name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1, feature/printer-offline-hybrid-20261022]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.4.0-offline-hybrid.zip
            dist/FTS-Printer-macOS-v0.4.0-offline-hybrid.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.4.0-offline-hybrid"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.4.0-offline-hybrid.zip dist/FTS-Printer-macOS-v0.4.0-offline-hybrid.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.4.0-offline-hybrid.zip dist/FTS-Printer-macOS-v0.4.0-offline-hybrid.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.4.0 · Offline + Hybrid" --notes "Build 150: Drei Event-Speichermodi Nur Laptop, Nur Online und Laptop und Online. Lokale Events speichern Originale, fertige Druckbilder, Layout/Banner und Eventeinstellungen dauerhaft auf dem Mac und bleiben ohne Supabase druckfähig. Offline-Administratorzugang wird sicher im macOS-Schlüsselbund eingerichtet. Hybrid-Aufträge bleiben bei Verbindungsausfall lokal verfügbar und werden kontrolliert nachsynchronisiert. Online-Aktualisierungen sind ereignisgesteuert statt dauerhaftem Polling. Bestehender Canon-SELPHY-Druck, SD A-Z, WLAN/USB-Kamera, Archiv, Material, Green Screen, MySelfie und QR-/Online-Funktionen bleiben erhalten."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.4.0-offline-hybrid"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
