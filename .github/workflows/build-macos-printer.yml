name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.2.2-dayalbums.zip
            dist/FTS-Printer-macOS-v0.2.2-dayalbums.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.2.2-dayalbums"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.2.2-dayalbums.zip dist/FTS-Printer-macOS-v0.2.2-dayalbums.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.2.2-dayalbums.zip dist/FTS-Printer-macOS-v0.2.2-dayalbums.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.2.2 · Tagesalben" --notes "Build 82 mit Tagesalben und JPEG-Vorrang."
          fi
