name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.28-banner-fullphoto-fix.zip
            dist/FTS-Printer-macOS-v0.3.28-banner-fullphoto-fix.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.28-banner-fullphoto-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.28-banner-fullphoto-fix.zip dist/FTS-Printer-macOS-v0.3.28-banner-fullphoto-fix.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.28-banner-fullphoto-fix.zip dist/FTS-Printer-macOS-v0.3.28-banner-fullphoto-fix.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.28 · Banner + Full Photo Fix" --notes "Build 118: Kleine Renderer-Korrektur ohne Änderung am Canon-Druckpfad. Ein hochgeladenes fertiges FTS-Banner wird als vollständiges 148×15-mm-Design mit 100 % Deckkraft und ohne Cover-Beschnitt gerendert; erzeugte Zusatzschrift und FTS-Branding werden bei einem fertigen Banner nicht mehr darübergelegt. Banner aus ist echter Vollfoto-Modus: keine Bannerfarbe, kein Bannertext, kein FTS-Branding und keine Foto-Dekoration/Logos. Druckerkennung, Spiegelkorrektur, SD A–E, Vorschau/Crop, Randoptionen, OK-zum-Druck, Archiv und Mehrdrucker-Verteilung bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.28-banner-fullphoto-fix"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
