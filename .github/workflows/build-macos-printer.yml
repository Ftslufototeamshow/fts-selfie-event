name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.42-green-screen-effects.zip
            dist/FTS-Printer-macOS-v0.3.42-green-screen-effects.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.42-green-screen-effects"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.42-green-screen-effects.zip dist/FTS-Printer-macOS-v0.3.42-green-screen-effects.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.42-green-screen-effects.zip dist/FTS-Printer-macOS-v0.3.42-green-screen-effects.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.42 · Green Screen + Photo Effects" --notes "Build 132: Green Screen und Einzelfoto-Effekte als Zusatzfunktion. Neuer Bereich Green Screen / Effekte mit Ein/Aus pro Event, Farbe, Bild, Comic-Burst, Feuerwerk und Kantenweichheit. Green Screen aus lässt den bestehenden Fotoweg unverändert. In der großen Fotoansicht sind Normal, Schwarz-Weiß, Oldschool, Film-Look, Warm, Kräftig, Kühl, Soft, S/W warm, S/W kühl, Sepia und Comic pro Foto wählbar. Comic bearbeitet Person, Gesicht, Haare und Kleidung; ohne Green Screen bleibt der Originalhintergrund normal, mit Green Screen wird der gewählte Hintergrund eingesetzt. Der gerenderte Stand wird für QR/Archiv/Nachdruck erhalten. Canon-Spooler, Spiegelkorrektur, Materiallogik, A-Z-Kartenlogik, Banner und Druckübertragung bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.42-green-screen-effects"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
