name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.17-sd-photo-visible.zip
            dist/FTS-Printer-macOS-v0.3.17-sd-photo-visible.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.17-sd-photo-visible"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.17-sd-photo-visible.zip dist/FTS-Printer-macOS-v0.3.17-sd-photo-visible.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.17-sd-photo-visible.zip dist/FTS-Printer-macOS-v0.3.17-sd-photo-visible.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.17 · SD Photo Visible" --notes "Build 107: Ergänzt den SD-Import-Fix aus Build 106 um die fehlende Anzeige-Logik. Die Foto-Quellenauswahl enthält nur noch Quellen mit tatsächlich aktiven druckbaren Fotos; bloß eingesteckte Karten erzeugen keine leeren Fotoquellen mehr. Sobald ein neues Foto importiert wird, wechselt die Fotoansicht automatisch zur Quelle des neuesten aktiven Fotos. Karten-, Drucker-, Archiv-, Design- und übrige UI-Logik bleiben unverändert."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.17-sd-photo-visible"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
