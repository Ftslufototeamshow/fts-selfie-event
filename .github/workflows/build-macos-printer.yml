name: Build FTS Printer macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - 'android-app/**'
      - '.github/workflows/**'
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'macos-app/**'
      - '.github/workflows/build-macos-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          chmod +x macos-app/build.sh
          macos-app/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-macOS
          path: |
            dist/FTS-Printer-macOS-v0.3.48-green-library-gif.zip
            dist/FTS-Printer-macOS-v0.3.48-green-library-gif.dmg
          if-no-files-found: error
      - name: Publish downloadable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-mac-v0.3.48-green-library-gif"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FTS-Printer-macOS-v0.3.48-green-library-gif.zip dist/FTS-Printer-macOS-v0.3.48-green-library-gif.dmg --clobber
          else
            gh release create "$TAG" dist/FTS-Printer-macOS-v0.3.48-green-library-gif.zip dist/FTS-Printer-macOS-v0.3.48-green-library-gif.dmg --target "$GITHUB_SHA" --title "FTS Printer macOS v0.3.48 · Green Library + GIF" --notes "Build 138: Green Screen Stufe 1 bis 3 fertig. Ein echter Kein-Hintergrund-Zustand verhindert den bisherigen Farb-Fallback nach Entfernen. Mehrere Bilder und GIFs werden pro Event in einer manuellen Hintergrundbibliothek gespeichert; genau ein Hintergrund kann manuell aktiviert oder ausgeschaltet werden, Bilder können aus der Event-Liste gelöscht und optional einem Veranstaltungstag als Kennzeichnung zugeordnet werden, ohne automatischen Wechsel. Alte Einzelbild-Einstellungen werden automatisch in die Bibliothek übernommen. Die Einstellungs-Vorschau zeigt das vollständige Bild ohne Abschneiden; GIFs laufen dort animiert. Physische Fotos und QR-Ausgaben bleiben Standbilder und verwenden den ersten/default GIF-Frame. Druckaufträge speichern nur den aktiven Green-Screen-Snapshot. Kamera Original bleibt unverändert; Druckbereit bleibt Green-Screen-neutral. SD-A-Z, schneller Import, Canon-Spooler, Spiegelkorrektur, Materiallogik, Archiv, QR und 148x15-mm-Banner bleiben bestehen."
          fi

      - name: Remove obsolete macOS releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/printer-core-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="fts-printer-mac-v0.3.48-green-library-gif"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read TAG; do
            case "$TAG" in
              fts-printer-mac-v*)
                if [ "$TAG" != "$CURRENT" ]; then
                  echo "Removing obsolete macOS release $TAG"
                  gh release delete "$TAG" --cleanup-tag -y || true
                fi
                ;;
            esac
          done
