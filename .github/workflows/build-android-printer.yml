name: Build FTS Printer Android

on:
  workflow_dispatch:
  push:
    branches: [main, printer-core-v1]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-printer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Download Gradle
        run: |
          curl -L --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build installable test APK
        run: |
          cd android-app
          /tmp/gradle-8.10.2/bin/gradle --no-daemon assembleDebug
          mkdir -p ../dist-android
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-android/FTS-Printer-Samsung-v0.2.0-core.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FTS-Printer-Samsung
          path: dist-android/FTS-Printer-Samsung-v0.2.0-core.apk
          if-no-files-found: error
      - name: Publish downloadable test release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fts-printer-android-v0.2.0-core"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-android/FTS-Printer-Samsung-v0.2.0-core.apk --clobber
          else
            gh release create "$TAG" dist-android/FTS-Printer-Samsung-v0.2.0-core.apk               --target "$GITHUB_SHA"               --title "FTS Printer Samsung / Android v0.2.0 CORE"               --prerelease               --notes "Installierbare interne Test-APK. Mitarbeiter-Login, Printer-Events, Selfie-Druckaufträge, Kundenbelege, Materialbestand, Mitarbeiterwechsel und lokaler Foto-Druck über Android Print Service."
          fi
