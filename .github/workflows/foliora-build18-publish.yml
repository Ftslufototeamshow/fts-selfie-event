name: FOLIORA Build 18 Publish Downloads

on:
  push:
    branches:
      - foliora-build18-ci
    paths:
      - .github/workflows/foliora-build18-publish.yml

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download validated Build 18 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/foliora-mac /tmp/foliora-android
          gh run download 39162870801 \
            --repo Ftslufototeamshow/fts-selfie-event \
            --name FOLIORA-Version-1-macOS-downloads \
            --dir /tmp/foliora-mac
          gh run download 39162870801 \
            --repo Ftslufototeamshow/fts-selfie-event \
            --name FOLIORA-Version-1-Android \
            --dir /tmp/foliora-android
          find /tmp/foliora-mac -maxdepth 2 -type f -print
          find /tmp/foliora-android -maxdepth 2 -type f -print

      - name: Publish direct Build 18 downloads
        env:
          SUPABASE_URL: https://hivmiqktbaatghuaxfvg.supabase.co
        run: |
          set -euo pipefail

          MAC_DMG="$(find /tmp/foliora-mac -type f -name '*Build-18-macOS.dmg' -print -quit)"
          MAC_ZIP="$(find /tmp/foliora-mac -type f -name '*Build-18-macOS.zip' -print -quit)"
          ANDROID_APK="$(find /tmp/foliora-android -type f -name '*.apk' -print -quit)"

          test -f "$MAC_DMG"
          test -f "$MAC_ZIP"
          test -f "$ANDROID_APK"

          OIDC_RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=foliora-supabase-update-upload")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_RESPONSE")"

          upload_file() {
            OBJECT_PATH="$1"
            FILE_PATH="$2"
            CONTENT_TYPE="$3"

            TICKET="$(curl -fsSL \
              -X POST "$SUPABASE_URL/functions/v1/foliora-update-upload-ticket" \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(python3 -c 'import json,sys; print(json.dumps({"path":sys.argv[1]}))' "$OBJECT_PATH")")"

            SIGNED_URL="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["signedUrl"])' <<<"$TICKET")"
            test -n "$SIGNED_URL"

            curl -fsSL \
              -X PUT "$SIGNED_URL" \
              -H "x-upsert: true" \
              -H "Content-Type: $CONTENT_TYPE" \
              -H "Cache-Control: max-age=0" \
              --data-binary @"$FILE_PATH"
            echo
          }

          upload_file \
            "downloads/FOLIORA-Version-1-Build-18-macOS.dmg" \
            "$MAC_DMG" \
            "application/zip"

          upload_file \
            "downloads/FOLIORA-Version-1-Build-18-macOS.zip" \
            "$MAC_ZIP" \
            "application/zip"

          upload_file \
            "downloads/FOLIORA-Version-1-Build-18-Android.apk" \
            "$ANDROID_APK" \
            "application/vnd.android.package-archive"

          echo "Build 18 direct downloads published."
