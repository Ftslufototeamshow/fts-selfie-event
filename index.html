<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f1e8;background:#071315;--accent:#d9b56d;--bg1:#071315;--bg2:#10383a}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at top right,var(--bg2),transparent 45%),linear-gradient(145deg,var(--bg1),var(--bg2))}
.wrap{width:min(980px,calc(100% - 22px));margin:auto;padding:20px 0 44px}.card{background:rgba(3,13,15,.95);border:1px solid rgba(255,255,255,.08);border-radius:26px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.34)}.brand{font-size:.72rem;letter-spacing:.2em;color:var(--accent);font-weight:900}h1{font-size:clamp(2.15rem,8vw,4rem);line-height:.96;margin:9px 0 8px}.sub{font-size:1.25rem;color:var(--accent);margin-bottom:12px;font-weight:800}.meta{color:#91a5a1;font-size:.86rem;margin-bottom:10px}.themeChip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;margin:0 0 15px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);color:var(--accent);font-size:.78rem;font-weight:900}
.net{display:flex;align-items:center;gap:8px;border-radius:12px;padding:9px 11px;margin:0 0 14px;font-size:.84rem}.online{background:rgba(65,170,113,.12);border:1px solid rgba(65,170,113,.28)}.offline{background:rgba(225,166,54,.12);border:1px solid rgba(225,166,54,.35)}
.moduleTitle{font-weight:900;margin:18px 0 8px}.choiceRow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.choice{border:1px solid rgba(255,255,255,.09);background:#0a2426;color:#e9efed;border-radius:13px;padding:9px 7px;cursor:pointer;text-align:center;font-weight:800;font-size:.75rem}.choice.active{outline:2px solid var(--accent);background:#123b3e}.choice small{display:block;color:#859b97;font-weight:600;margin-top:3px;font-size:.65rem}.frameMini{height:48px;margin:0 auto 7px;border:2px solid color-mix(in srgb,var(--accent) 70%,#fff);border-radius:7px;display:grid;place-items:center;color:var(--accent);font-size:.7rem}.frameMini.portrait{width:34px}.frameMini.duo{width:38px}.frameMini.wide{width:63px;height:39px}.frameMini.story{width:29px;height:52px}.frameMini.free{width:50px;height:44px;border-style:dashed}
.logoEvent{max-height:58px;max-width:160px;object-fit:contain;margin:2px 0 10px;display:none}.logoEvent.show{display:block}
.upload{display:grid;place-items:center;min-height:165px;border:2px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:20px;text-align:center;padding:22px;cursor:pointer;background:rgba(0,0,0,.12);margin-top:14px}.upload strong{font-size:1.2rem}.upload span{display:block;color:#9cacaa;margin-top:8px}.upload input{display:none}
.compare{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.previewBox{min-width:0;background:#061012;border:1px solid rgba(255,255,255,.08);border-radius:17px;padding:7px}.previewBox b{display:block;margin:2px 4px 7px;color:var(--accent);font-size:.78rem}.previewBox img,.previewBox canvas{width:100%;height:auto;max-height:560px;object-fit:contain;border-radius:10px;display:block}
.privacyInfo{margin:17px 0 10px;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);color:#aebbb9;font-size:.82rem;line-height:1.45}.privacyInfo strong{display:block;color:#f3eee5;margin-bottom:5px}.consent{display:flex;gap:10px;align-items:flex-start;margin:12px 0 17px;color:#c5cfcd;font-size:.9rem}.consent input{margin-top:3px;transform:scale(1.2)}
button.main{width:100%;border:0;border-radius:15px;padding:16px;font:inherit;font-weight:900;background:var(--accent);color:#102020;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.msg{border-radius:14px;padding:13px 15px;margin:15px 0 0;display:none}.ok{display:block;background:rgba(68,180,117,.16);border:1px solid rgba(68,180,117,.35)}.warn{display:block;background:rgba(225,166,54,.13);border:1px solid rgba(225,166,54,.35)}.err{display:block;background:rgba(220,80,80,.14);border:1px solid rgba(220,80,80,.35)}.foot{text-align:center;color:#7f9692;font-size:.78rem;margin-top:18px}.loading{padding:60px 20px;text-align:center;color:#a8b6b4}
@media(max-width:680px){.choiceRow{grid-template-columns:repeat(2,1fr)}.card{padding:14px}.compare{gap:5px}.previewBox{padding:4px}.previewBox b{font-size:.68rem}}

.langBar{display:flex;gap:6px;justify-content:flex-end;margin:-2px 0 12px}.langBar button{border:1px solid rgba(255,255,255,.1);background:#0a2426;color:#dce5e3;border-radius:999px;padding:7px 10px;font-weight:900;cursor:pointer}.langBar button.active{background:var(--accent);color:#102020}
.eventStatus{padding:11px 13px;border-radius:13px;margin:0 0 14px;font-size:.84rem;line-height:1.4}.eventStatus.test{background:rgba(225,166,54,.13);border:1px solid rgba(225,166,54,.35)}.eventStatus.closed{background:rgba(210,88,88,.13);border:1px solid rgba(210,88,88,.3)}.eventStatus.day{background:rgba(65,170,113,.12);border:1px solid rgba(65,170,113,.28)}
.adSlot{display:none;margin:14px 0 4px}.adSlot.show{display:block}.adLabel{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#829592;margin:0 0 5px 3px}.adFrame{display:block;width:100%;border-radius:13px;overflow:hidden;background:#02090a;border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 28px rgba(0,0,0,.24)}.adFrame img{display:block;width:100%;aspect-ratio:4/1;object-fit:cover}.adFrame:not([href]){cursor:default}

</style>

<script src="./config.js"></script>
<script>

const params=new URLSearchParams(location.search);
const eventToken=params.get('e') || cfg.defaultEventToken;
const EVENT_CACHE_KEY='fts_event_cache_'+eventToken;
const DB_NAME='fts_selfie_offline_v1', STORE='queue';
let ev=null,selectedFile=null,designedBlob=null,selectedLayout='solo',selectedFilter='natural',redrawTimer=null;
let lang='de',routeMode='closed',routeDay=null,adTimer=null,adIndex=0;
const DEFAULT_LAYOUTS=['solo','duo','groupwide','grouptall','free'];
const DEFAULT_FILTERS=['natural','warm','vivid','mono','cool'];

const layoutInfo={

};

const I18N={

  tooBig:'Das Original ist größer als 15 MB.',uploading:'Foto wird hochgeladen …',offlineSaving:'Foto wird offline gespeichert …',
  success:'✓ Original und deine Event-Version erfolgreich hochgeladen. Danke!',
  queued:'✓ Foto sicher gespeichert. Upload läuft automatisch weiter, sobald die Verbindung stabil ist.',

  saveError:'Das Foto konnte nicht sicher gespeichert werden',
  test:'TESTMODUS · Dieses Foto wird getrennt gespeichert und erscheint nicht im Kundenalbum.',
  eventDay:'Aktiver Event-Tag',tooEarly:'Dieses Event ist noch nicht für Selfie-Uploads freigeschaltet.',ended:'Die Event-Tage sind beendet. Das Kundenportal kann weiterhin sichtbar sein.',
  queueOne:'Foto wartet auf Upload',queueMany:'Fotos warten auf Upload',
  solo:'1 Person · Hoch',soloDesc:'Portrait',duo:'2 Personen · Hoch',duoDesc:'Duo',
  groupwide:'Gruppe · Breit',groupwideDesc:'3–5 Personen',grouptall:'Gruppe · Hoch',grouptallDesc:'3–5 Personen',free:'Originalformat',freeDesc:'frei',
  natural:'Natürlich',naturalDesc:'neutral',warm:'Warm',warmDesc:'weicher',vivid:'Kräftig',vividDesc:'mehr Farbe',mono:'Schwarzweiß',monoDesc:'klassisch',cool:'Cool',coolDesc:'moderner Look'
 },

  layoutTitle:'1. Choose photo layout',filterTitle:'2. Choose look / filter',photoTitle:'📸 3. Take a selfie',
  photoSub:'or choose a photo from your phone · you can change layout and filter afterwards',
  original:'Original',design:'Your event design',privacyTitle:'Privacy & consent',
  privacy:'The photo I upload will be processed and stored by FTS.lu only for this event and made available to the organizer in the customer portal. No name is requested or stored together with the photo. Availability in the event portal is time-limited. Consent can be withdrawn for the future.',

  original:'Original',design:'Votre design événement',privacyTitle:'Confidentialité & consentement',
  privacy:'La photo que je téléverse est traitée et stockée par FTS.lu uniquement pour cet événement et mise à disposition de l’organisateur dans le portail client. Aucun nom n’est demandé ni enregistré avec la photo. La disponibilité dans le portail est limitée dans le temps. Le consentement peut être retiré pour l’avenir.',

  test:'MODE TEST · Cette photo est enregistrée séparément et n’apparaît pas dans l’album client.',
  eventDay:'Jour d’événement actif',tooEarly:'Cet événement n’est pas encore ouvert aux selfies.',ended:'Les jours de l’événement sont terminés. Le portail client peut rester disponible.',
  queueOne:'photo en attente',queueMany:'photos en attente',
  solo:'1 personne · portrait',soloDesc:'portrait',duo:'2 personnes · portrait',duoDesc:'duo',
  groupwide:'Groupe · paysage',groupwideDesc:'3–5 personnes',grouptall:'Groupe · portrait',grouptallDesc:'3–5 personnes',free:'Format original',freeDesc:'libre',
  natural:'Naturel',naturalDesc:'neutre',warm:'Chaud',warmDesc:'plus doux',vivid:'Vif',vividDesc:'plus de couleur',mono:'Noir & blanc',monoDesc:'classique',cool:'Froid',coolDesc:'style moderne'
 }
};
function tr(k){return I18N[lang]?.[k]||I18N.de[k]||k}
function detectLang(){
  const saved=localStorage.getItem('fts_guest_lang');
  if(['de','en','fr'].includes(saved))return saved;
  const langs=navigator.languages||[navigator.language||'de'];
  if(langs.some(x=>String(x).toLowerCase().startsWith('fr')))return'fr';
  if(langs.some(x=>String(x).toLowerCase().startsWith('en')))return'en';
  return'de';
}


function apiHeaders(json=true){const h={'apikey':cfg.publishableKey,'Authorization':'Bearer '+cfg.publishableKey};if(json)h['Content-Type']='application/json';return h}
async function rpc(name,body){const r=await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${name}`,{method:'POST',headers:apiHeaders(true),body:JSON.stringify(body)});if(!r.ok)throw new Error((await r.text())||`RPC ${r.status}`);const t=await r.text();return t?JSON.parse(t):null}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function queuePut(item){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function queueDelete(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function queueAll(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}
async function updateQueueCount(){try{const n=(await queueAll()).length;const el=document.getElementById('net');if(!el)return;if(n>0)el.innerHTML=`⏳ ${n} ${n===1?tr('queueOne'):tr('queueMany')}`}catch{}}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/')}
async function uploadObject(path,blob,type){const u=`${cfg.supabaseUrl}/storage/v1/object/${encodeURIComponent(cfg.liveBucket)}/${encodePath(path)}`;const r=await fetch(u,{method:'POST',headers:{'apikey':cfg.publishableKey,'Authorization':'Bearer '+cfg.publishableKey,'Content-Type':type||'application/octet-stream','x-upsert':'false'},body:blob});if(!r.ok){const txt=await r.text();if(r.status===409||/already exists/i.test(txt))return;throw new Error(txt||`Storage ${r.status}`)}}
async function registerPhoto(item){await rpc('fts_register_photo',{p_event_token:item.eventToken,p_original_path:item.originalPath,p_designed_path:item.designedPath})}
async function uploadItem(item){await uploadObject(item.originalPath,item.originalBlob,item.originalType);await uploadObject(item.designedPath,item.designedBlob,'image/jpeg');await registerPhoto(item)}
async function processQueue(){if(!navigator.onLine)return updateNet();const items=await queueAll();for(const item of items){try{await uploadItem(item);await queueDelete(item.id)}catch(e){console.warn('Queue upload',e);break}}updateNet();updateQueueCount()}
function updateNet(){const el=document.getElementById('net');if(!el)return;el.className='net '+(navigator.onLine?'online':'offline');el.textContent=navigator.onLine?tr('online'):tr('offline')}
function assetUrl(path){if(!path)return'';return `${cfg.supabaseUrl}/storage/v1/object/public/${encodeURIComponent(cfg.liveBucket)}/${encodePath(path)}`}
function boolish(v){return v===true||v===1||String(v).toLowerCase()==='true'}
function adItemsFor(){
  if(!boolish(ev?.ads_enabled))return[];
  let items=ev?.ad_items;if(!Array.isArray(items)){try{items=JSON.parse(items||'[]')}catch{items=[]}}
  return items.filter(x=>x?.path&&x.active!==false);
}
function safeAdLink(v){try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}}
function stopAds(){if(adTimer){clearInterval(adTimer);adTimer=null}}
function showCurrentAd(){
  const slot=document.getElementById('adSlot'),img=document.getElementById('adImage'),link=document.getElementById('adLink'),items=adItemsFor();
  if(!slot||!img||!link||!selectedFile||!items.length){slot?.classList.remove('show');stopAds();return}
  adIndex=((adIndex%items.length)+items.length)%items.length;const item=items[adIndex];img.src=assetUrl(item.path);img.alt=item.name||'Werbung';
  const href=safeAdLink(item.link);if(href){link.href=href;link.target='_blank';link.rel='noopener noreferrer'}else{link.removeAttribute('href');link.removeAttribute('target');link.removeAttribute('rel')}
  slot.classList.add('show');
}
function startAds(){
  stopAds();const items=adItemsFor();if(!selectedFile||!items.length)return showCurrentAd();adIndex=0;showCurrentAd();
  if(items.length>1)adTimer=setInterval(()=>{adIndex=(adIndex+1)%items.length;showCurrentAd()},3000);
}
function logoItemsFor(target){
  let items=[];
  if(Array.isArray(ev?.logo_items))items=ev.logo_items;
  else{try{items=JSON.parse(ev?.logo_items||'[]')}catch{}}
  if(!items.length&&ev?.logo_path)items=[{path:ev.logo_path,name:'Logo',position:'top-right',size:'medium',show_poster:true,show_photo:true}];
  return items.filter(x=>x?.path && (target==='photo'?x.show_photo!==false:x.show_poster!==false));
}

function decorationItemsFor(target){
  let items=[];
  if(Array.isArray(ev?.decoration_items))items=ev.decoration_items;
  else{try{items=JSON.parse(ev?.decoration_items||'[]')}catch{}}
  return items.filter(x=>x?.symbol && (target==='photo'?x.show_photo!==false:x.show_poster!==false));
}
function eventDays(){
  let d=ev?.event_days;
  if(!Array.isArray(d)){try{d=JSON.parse(d||'[]')}catch{d=[]}}
  if(!d.length && ev?.event_date)d=[ev.event_date];
  return [...new Set(d.filter(Boolean))].sort();
}
function luxDate(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Luxembourg',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const get=t=>parts.find(x=>x.type===t)?.value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function addDays(dateStr,delta){
  const d=new Date(dateStr+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+delta);
  return d.toISOString().slice(0,10);
}
function resolveRoute(){
  const days=eventDays(),today=luxDate();
  if(days.includes(today)){routeMode='day';routeDay=today;return}
  const first=days[0],last=days[days.length-1],testDays=Number(ev?.test_days_before||0);
  if(first && today<first && today>=addDays(first,-testDays)){routeMode='test';routeDay=null;return}
  if(first && today<addDays(first,-testDays)){routeMode='too-early';routeDay=null;return}
  if(last && today>last){routeMode='ended';routeDay=null;return}
  routeMode='closed';routeDay=null;
}

function asArray(v,fallback){if(Array.isArray(v)&&v.length)return v;try{const p=JSON.parse(v);if(Array.isArray(p)&&p.length)return p}catch{}return fallback}
async function boot(){
 lang=detectLang();
 let data=null;
 try{if(navigator.onLine){
   data=await rpc('fts_get_event',{p_event_token:eventToken});
   if(data?.length){
     const merged={...data[0],ads_enabled:false,ad_items:[]};
     try{
       let ads;
       try{ads=await rpc('fts_get_event_ads_v2',{p_event_token:eventToken})}
       catch(_e){ads=await rpc('fts_get_event_ads_v1',{p_event_token:eventToken})}
       if(ads?.length){merged.ads_enabled=boolish(ads[0].ads_enabled);merged.ad_items=ads[0].ad_items||[]}
     }catch(adErr){console.warn('Werbung online load',adErr)}
     data=[merged];localStorage.setItem(EVENT_CACHE_KEY,JSON.stringify(merged));
   }
 }}catch(e){console.warn('Event online load',e)}
 if(data?.length)ev=data[0];else{try{ev=JSON.parse(localStorage.getItem(EVENT_CACHE_KEY)||'null')}catch{}}
 if(!ev){document.getElementById('card').innerHTML='<div class="loading"><h2>Dieses Event wurde auf diesem Handy noch nicht geladen.</h2><p>Für den ersten Aufruf ist einmal Internet erforderlich. Danach funktioniert die Selfie-Seite auch bei Netzausfall.</p></div>';return}
 render();processQueue();
}
function render(){
 document.documentElement.style.setProperty('--accent',ev.accent||'#d9b56d');
 document.documentElement.style.setProperty('--bg1',ev.bg1||'#071315');
 document.documentElement.style.setProperty('--bg2',ev.bg2||'#10383a');

 const layouts=asArray(ev.available_layouts,DEFAULT_LAYOUTS).filter(x=>layoutInfo[x]);
 const filters=asArray(ev.available_filters,DEFAULT_FILTERS).filter(x=>filterInfo[x]);
 selectedLayout=layouts[0]||'solo';
 selectedFilter=filters[0]||'natural';
 resolveRoute();

 const statusClass=routeMode==='test'?'test':routeMode==='day'?'day':'closed';
 const statusText=routeMode==='test'
   ? tr('test')
   : routeMode==='day'
     ? `${tr('eventDay')}: ${new Date(routeDay+'T12:00:00').toLocaleDateString(lang==='de'?'de-DE':lang==='fr'?'fr-FR':'en-GB')}`
     : routeMode==='too-early'
       ? tr('tooEarly')
       : tr('ended');

 document.getElementById('card').innerHTML=`
   <div class="langBar">
     <button data-lang="de">DE</button>
     <button data-lang="en">EN</button>
     <button data-lang="fr">FR</button>
   </div>
   <div class="brand">FTS.LU · SELFIE EVENT</div>
   ${logoItemsFor('photo')[0]?.path?`<img class="logoEvent show" src="${assetUrl(logoItemsFor('photo')[0].path)}" crossorigin="anonymous" alt="Event-Logo">`:''}
   <h1>${esc(ev.title)}</h1>
   <div class="sub">${esc(ev.subtitle||'')}</div>
   <div class="meta">${esc(ev.location||'')} · ${eventDays().map(d=>new Date(d+'T12:00:00').toLocaleDateString(lang==='de'?'de-DE':lang==='fr'?'fr-FR':'en-GB')).join(' · ')}</div>
   <div class="eventStatus ${statusClass}" id="eventStatus">${statusText}</div>
   <div id="net" class="net"></div>

   <div class="moduleTitle" id="layoutTitle">${tr('layoutTitle')}</div>
   <div class="choiceRow" id="layoutChoices">${layouts.map(layoutButton).join('')}</div>

   <div class="moduleTitle" id="filterTitle">${tr('filterTitle')}</div>
   <div class="choiceRow" id="filterChoices">${filters.map(filterButton).join('')}</div>

   <label class="upload" id="uploadLabel">
     <div><strong id="photoTitle">${tr('photoTitle')}</strong><span id="photoSub">${tr('photoSub')}</span></div>
     <input id="photo" type="file" accept="image/*" capture="user" ${['day','test'].includes(routeMode)?'':'disabled'}>
   </label>

   <section class="compare" id="compare">
     <div class="previewBox"><b id="originalLabel">${tr('original')}</b><img id="originalPreview"></div>
     <div class="previewBox"><b id="designLabel">${tr('design')}</b><canvas id="designCanvas"></canvas></div>
   </section>

   <div class="adSlot" id="adSlot"><div class="adLabel">Werbung</div><a class="adFrame" id="adLink"><img id="adImage" alt="Werbung"></a></div>

   <div class="privacyInfo"><strong id="privacyTitle">${tr('privacyTitle')}</strong><span id="privacyText">${tr('privacy')}</span></div>
   <label class="consent"><input id="consent" type="checkbox" ${['day','test'].includes(routeMode)?'':'disabled'}><span id="consentText">${tr('consent')}</span></label>
   <button class="main" id="uploadBtn" ${['day','test'].includes(routeMode)?'':'disabled'}>${tr('send')}</button>
   <div id="message" class="msg"></div><div class="foot">FTS.lu · Eventfotografie</div>`;

 updateNet();updateQueueCount();bindChoices();bindLanguages();

 document.getElementById('photo').addEventListener('change',onPhoto);
 document.getElementById('uploadBtn').addEventListener('click',submitPhoto);
}
function layoutButton(key){const x=layoutInfo[key];return `<button type="button" class="choice ${key===selectedLayout?'active':''}" data-layout="${key}"><div class="frameMini ${x.mini}">${key==='solo'?'1':key==='duo'?'2':key.includes('group')?'3–5':'↔'}</div>${esc(tr(x.label))}<small>${esc(tr(x.desc))}</small></button>`}
function filterButton(key){const x=filterInfo[key];return `<button type="button" class="choice ${key===selectedFilter?'active':''}" data-filter="${key}">${esc(tr(x.label))}<small>${esc(tr(x.desc))}</small></button>`}
function bindLanguages(){
 document.querySelectorAll('[data-lang]').forEach(b=>{
   b.classList.toggle('active',b.dataset.lang===lang);
   b.onclick=()=>{
     lang=b.dataset.lang;
     localStorage.setItem('fts_guest_lang',lang);
     render();
     if(selectedFile){
       document.getElementById('originalPreview').src=URL.createObjectURL(selectedFile);
       makeDesign(selectedFile).then(()=>{document.getElementById('compare').style.display='grid';startAds()});
     }
   };
 });
}
function bindChoices(){
 document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{selectedLayout=b.dataset.layout;document.querySelectorAll('[data-layout]').forEach(x=>x.classList.toggle('active',x===b));scheduleRedraw()});
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{selectedFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));scheduleRedraw()});
}
function scheduleRedraw(){if(!selectedFile)return;clearTimeout(redrawTimer);redrawTimer=setTimeout(()=>makeDesign(selectedFile),60)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showMessage(text,kind='err'){const x=document.getElementById('message');x.textContent=text;x.className='msg '+kind}
function loadImageFile(file){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=URL.createObjectURL(file)})}
function loadRemoteImage(url){return new Promise((resolve,reject)=>{if(!url)return resolve(null);const img=new Image();img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=url})}
function roundRect(c,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+rr,y);c.arcTo(x+w,y,x+w,y+h,rr);c.arcTo(x+w,y+h,x,y+h,rr);c.arcTo(x,y+h,x,y,rr);c.arcTo(x,y,x+w,y,rr);c.closePath()}
async function onPhoto(){const file=document.getElementById('photo').files?.[0];if(!file)return;selectedFile=file;document.getElementById('originalPreview').src=URL.createObjectURL(file);await makeDesign(file);document.getElementById('compare').style.display='grid';document.getElementById('message').className='msg';startAds()}
function themeLabel(){return ({standard:'FTS Standard',autumn:'Kürbis / Herbst',halloween:'Halloween',streetfood:'Streetfood',cars:'Auto / Motorsport',neon:'Party / Neon',winter:'Winter / Weihnachten',spring:'Frühling',summer:'Sommer',wedding:'Hochzeit',sports:'Sport',business:'Firmen / Business',festival:'Festival',carnival:'Karneval'})[ev?.theme||'standard']||'FTS Event'}
function eventMotif(){return ev?.motif||({standard:'✦',autumn:'🎃',halloween:'👻',streetfood:'🍔',cars:'🏎️',neon:'✦',winter:'❄',spring:'🌸',summer:'☀️',wedding:'♥',sports:'⚽',business:'◆',festival:'🎪',carnival:'🎭'})[ev?.theme||'standard']||'✦'}
function filterCss(key){return ({natural:'none',warm:'saturate(1.08) sepia(.14) contrast(1.03)',vivid:'saturate(1.38) contrast(1.10)',mono:'grayscale(1) contrast(1.09)',cool:'saturate(.96) hue-rotate(10deg) brightness(1.03)'})[key]||'none'}
function clamp255(v){return v<0?0:v>255?255:v}
function applyPixelFilter(canvas,key){
 if(!canvas||key==='natural')return;
 const c=canvas.getContext('2d',{willReadFrequently:true}),im=c.getImageData(0,0,canvas.width,canvas.height),d=im.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]===0)continue;
  let r=d[i],g=d[i+1],b=d[i+2];
  if(key==='mono'){
   let y=.2126*r+.7152*g+.0722*b;y=(y-128)*1.10+128;r=g=b=y;
  }else if(key==='warm'){
   const y=.2126*r+.7152*g+.0722*b;r=y+(r-y)*1.08+9;g=y+(g-y)*1.05+3;b=y+(b-y)*.92-5;
  }else if(key==='vivid'){
   const y=.2126*r+.7152*g+.0722*b;r=y+(r-y)*1.38;g=y+(g-y)*1.38;b=y+(b-y)*1.38;r=(r-128)*1.10+128;g=(g-128)*1.10+128;b=(b-128)*1.10+128;
  }else if(key==='cool'){
   const y=.2126*r+.7152*g+.0722*b;r=y+(r-y)*.98-5;g=y+(g-y)*1.02+1;b=y+(b-y)*1.10+10;
  }
  d[i]=clamp255(r);d[i+1]=clamp255(g);d[i+2]=clamp255(b);
 }
 c.putImageData(im,0,0);
}
function makePhotoLayer(w,h,draw,key){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x);applyPixelFilter(c,key);return c}
function drawFilteredCover(ctx,img,w,h,zoom=1,key=selectedFilter){const layer=makePhotoLayer(w,h,x=>drawCover(x,img,w,h,zoom),key);ctx.drawImage(layer,0,0)}

function layoutCanvas(img,key){
 const maxW=1600;
 if(key==='solo')return {w:1200,h:1500,mode:'cover',zoom:1.08};
 if(key==='duo')return {w:1200,h:1500,mode:'contain'};
 if(key==='groupwide')return {w:1600,h:1000,mode:'contain'};
 if(key==='grouptall')return {w:1080,h:1920,mode:'contain'};
 const scale=Math.min(1,maxW/img.naturalWidth);return {w:Math.round(img.naturalWidth*scale),h:Math.round(img.naturalHeight*scale),mode:'cover',zoom:1};
}
function drawCover(ctx,img,w,h,zoom=1){
 const s=Math.max(w/img.naturalWidth,h/img.naturalHeight)*zoom,dw=img.naturalWidth*s,dh=img.naturalHeight*s;
 ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
}
function drawContainWithBlur(ctx,img,w,h){
 ctx.save();ctx.globalAlpha=.68;drawCover(ctx,img,w,h,1.04);ctx.restore();
 ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(0,0,w,h);
 const s=Math.min(w/img.naturalWidth,h/img.naturalHeight)*.96,dw=img.naturalWidth*s,dh=img.naturalHeight*s;
 const layer=makePhotoLayer(w,h,x=>x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh),selectedFilter);
 ctx.drawImage(layer,0,0);
}
function drawThemeDecor(ctx,w,h){
 const motif=String(eventMotif()||'').trim(),size=Math.max(48,w*.06);
 ctx.save();ctx.globalAlpha=.92;ctx.textAlign='right';ctx.textBaseline='top';ctx.font=`700 ${size}px system-ui`;ctx.fillText(motif,w-Math.max(22,w*.03),Math.max(18,w*.025));ctx.restore();
}
function fitText(ctx,text,maxWidth,startSize,minSize,weight=900){let size=startSize;for(;size>minSize;size-=2){ctx.font=`${weight} ${size}px system-ui`;if(ctx.measureText(text).width<=maxWidth)break}return size}
function logoSizeSpec(item,w,h){
  const size=item.size||'medium';
  const map={small:[.12,.075],medium:[.18,.105],large:[.26,.145]};
  const [mw,mh]=map[size]||map.medium;
  return {maxW:w*mw,maxH:h*mh};
}
async function drawEventLogos(ctx,w,h,target='photo'){
  const items=logoItemsFor(target);
  if(!items.length)return;

  const loaded=[];
  for(const item of items){
    const img=await loadRemoteImage(assetUrl(item.path));
    if(img)loaded.push({item,img});
  }

  const groups={};
  loaded.forEach(x=>(groups[x.item.position||'top-right']??=[]).push(x));

  const pad=Math.max(22,w*.035),gap=Math.max(10,w*.012);
  for(const [position,arr] of Object.entries(groups)){
    const dims=arr.map(({item,img})=>{
      const spec=logoSizeSpec(item,w,h);
      const s=Math.min(spec.maxW/img.naturalWidth,spec.maxH/img.naturalHeight,1);
      return {item,img,w:img.naturalWidth*s,h:img.naturalHeight*s};
    });

    const totalW=dims.reduce((s,d)=>s+d.w,0)+gap*Math.max(0,dims.length-1);
    const rowH=Math.max(...dims.map(d=>d.h),0);

    let x=pad,y=pad;
    if(position.includes('center'))x=(w-totalW)/2;
    else if(position.includes('right'))x=w-pad-totalW;

    if(position.startsWith('middle'))y=(h-rowH)/2;
    else if(position.startsWith('bottom'))y=h-pad-rowH;

    for(const d of dims){
      const yy=y+(rowH-d.h)/2;
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=Math.max(6,w*.008);ctx.shadowOffsetY=Math.max(3,w*.004);
      ctx.drawImage(d.img,x,yy,d.w,d.h);
      ctx.restore();
      x+=d.w+gap;
    }
  }
}

function decoSizePx(size,w){
  return size==='small'?Math.max(34,w*.038):size==='large'?Math.max(70,w*.078):Math.max(50,w*.055);
}
function positionXY(position,w,h,pad,rowW,rowH){
  let x=pad,y=pad;
  if(position.includes('center'))x=(w-rowW)/2;
  else if(position.includes('right'))x=w-pad-rowW;
  if(position.startsWith('middle'))y=(h-rowH)/2;
  else if(position.startsWith('bottom'))y=h-pad-rowH;
  return {x,y};
}
function drawEventDecorations(ctx,w,h,target='photo'){
  const items=decorationItemsFor(target);
  const groups={};
  items.forEach(x=>(groups[x.position||'bottom-right']??=[]).push(x));
  const pad=Math.max(24,w*.035),gap=Math.max(8,w*.01);

  for(const [position,arr] of Object.entries(groups)){
    const dims=arr.map(item=>{
      const px=decoSizePx(item.size||'medium',w);
      return {item,px,w:px*1.25,h:px*1.25};
    });
    const totalW=dims.reduce((s,d)=>s+d.w,0)+gap*Math.max(0,dims.length-1);
    const rowH=Math.max(...dims.map(d=>d.h),0);
    let {x,y}=positionXY(position,w,h,pad,totalW,rowH);

    for(const d of dims){
      ctx.save();
      ctx.font=`700 ${d.px}px system-ui`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=Math.max(6,w*.008);
      ctx.fillText(String(d.item.symbol||''),x+d.w/2,y+rowH/2);
      ctx.restore();
      x+=d.w+gap;
    }
  }
}

async function makeDesign(file){
 const img=await loadImageFile(file),canvas=document.getElementById('designCanvas'),ctx=canvas.getContext('2d'),spec=layoutCanvas(img,selectedLayout);
 canvas.width=spec.w;canvas.height=spec.h;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=ev.bg1||'#071315';ctx.fillRect(0,0,canvas.width,canvas.height);
 if(spec.mode==='contain')drawContainWithBlur(ctx,img,canvas.width,canvas.height);else drawFilteredCover(ctx,img,canvas.width,canvas.height,spec.zoom||1,selectedFilter)
 const top=ctx.createLinearGradient(0,0,0,canvas.height*.28);top.addColorStop(0,'rgba(0,0,0,.48)');top.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=top;ctx.fillRect(0,0,canvas.width,canvas.height*.32);
 const bottom=ctx.createLinearGradient(0,canvas.height*.48,0,canvas.height);bottom.addColorStop(0,'rgba(3,14,15,0)');bottom.addColorStop(.3,'rgba(3,14,15,.64)');bottom.addColorStop(1,'rgba(3,14,15,.96)');ctx.fillStyle=bottom;ctx.fillRect(0,canvas.height*.48,canvas.width,canvas.height*.52);


 const pad=Math.max(24,canvas.width*.045);
 const maxW=canvas.width-pad*2,y=canvas.height-pad*2.35,title=String(ev.title||'');ctx.textBaseline='alphabetic';ctx.fillStyle='#fff';
 const titleSize=fitText(ctx,title,maxW,Math.max(38,canvas.width*.06),Math.max(25,canvas.width*.037),900);ctx.font=`900 ${titleSize}px system-ui`;ctx.fillText(title,pad,y-Math.max(48,canvas.width*.058));
 ctx.fillStyle=ev.accent;const sub=String(ev.subtitle||'');const subSize=fitText(ctx,sub,maxW,Math.max(25,canvas.width*.035),Math.max(18,canvas.width*.024),800);ctx.font=`800 ${subSize}px system-ui`;ctx.fillText(sub,pad,y);
 ctx.fillStyle='rgba(255,255,255,.88)';const over=String(ev.overlay_text||ev.title||'');const overSize=fitText(ctx,over,maxW,Math.max(18,canvas.width*.024),Math.max(14,canvas.width*.018),600);ctx.font=`600 ${overSize}px system-ui`;ctx.fillText(over,pad,y+Math.max(30,canvas.width*.035));
 if((ev.photo_branding||'bottom')!=='none'){ctx.save();ctx.textAlign='right';ctx.textBaseline='alphabetic';ctx.fillStyle='rgba(255,255,255,.72)';ctx.font=`600 ${Math.max(14,canvas.width*.016)}px system-ui`;ctx.fillText('FTS.lu · Selfie Event',canvas.width-pad,canvas.height-Math.max(18,canvas.height*.018));ctx.restore()}
 await drawEventLogos(ctx,canvas.width,canvas.height,'photo');
 await Promise.resolve(drawEventDecorations(ctx,canvas.width,canvas.height,'photo'));
 designedBlob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.91));
}
async function submitPhoto(){
 if(!['day','test'].includes(routeMode))return showMessage(routeMode==='too-early'?tr('tooEarly'):tr('ended'));
 if(!selectedFile)return showMessage(tr('noPhoto'));
 if(!document.getElementById('consent').checked)return showMessage(tr('noConsent'));
 if(selectedFile.size>15*1024*1024)return showMessage(tr('tooBig'));
 if(!designedBlob)await makeDesign(selectedFile);

 const btn=document.getElementById('uploadBtn');btn.disabled=true;const queueId=`${Date.now()}_${crypto.randomUUID()}`;const originalId=`${Date.now()}_${crypto.randomUUID()}`;const designId=`${Date.now()}_${crypto.randomUUID()}`;const ext=(selectedFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
 const storageSlug=String(ev.storage_slug||'event').replace(/[^a-z0-9-]/gi,'-').replace(/-+/g,'-');
 const routeBase=routeMode==='test'
   ? `${ev.event_token}/${storageSlug}/test`
   : `${ev.event_token}/${storageSlug}/days/${routeDay}`;
 const item={
   id:queueId,createdAt:Date.now(),eventToken:ev.event_token,
   originalPath:`${routeBase}/original/${originalId}.${ext}`,
   designedPath:`${routeBase}/designed/${designId}.jpg`,
   originalBlob:selectedFile,designedBlob,originalType:selectedFile.type||'image/jpeg'
 };
 try{
  if(navigator.onLine){btn.textContent=tr('uploading');try{await uploadItem(item);showMessage(tr('success'),'ok')}catch(e){await queuePut(item);showMessage(tr('queued'),'warn');registerBackgroundSync()}}
  else{btn.textContent=tr('offlineSaving');await queuePut(item);showMessage(tr('queuedOffline'),'warn');registerBackgroundSync()}
  selectedFile=null;designedBlob=null;stopAds();document.getElementById('adSlot')?.classList.remove('show');document.getElementById('photo').value='';document.getElementById('consent').checked=false;await updateQueueCount();
 }catch(e){console.error(e);showMessage(tr('saveError')+': '+(e?.message||'Error'),'err')}
 finally{btn.disabled=false;btn.textContent=tr('send')}
}
async function registerBackgroundSync(){try{const reg=await navigator.serviceWorker.ready;if('sync'in reg)await reg.sync.register('fts-upload-queue')}catch(e){console.warn('Background Sync nicht verfügbar',e)}}
window.addEventListener('online',()=>{updateNet();processQueue()});window.addEventListener('offline',updateNet);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine)processQueue()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);boot();
</script>
