<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071315">
<link rel="manifest" href="./manifest.webmanifest">
<title>FTS Selfie Event</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f1e8;background:#071315;--accent:#d9b56d;--bg1:#071315;--bg2:#10383a}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(circle at top right,var(--bg2),transparent 45%),linear-gradient(145deg,var(--bg1),var(--bg2))}
.wrap{width:min(920px,calc(100% - 22px));margin:auto;padding:20px 0 44px}
.card{background:rgba(3,13,15,.95);border:1px solid rgba(255,255,255,.08);border-radius:26px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.34)}
.brand{font-size:.72rem;letter-spacing:.2em;color:var(--accent);font-weight:900}
h1{font-size:clamp(2.15rem,8vw,4rem);line-height:.96;margin:9px 0 8px}
.sub{font-size:1.25rem;color:var(--accent);margin-bottom:12px;font-weight:800}
.meta{color:#91a5a1;font-size:.86rem;margin-bottom:18px}
.net{display:flex;align-items:center;gap:8px;border-radius:12px;padding:9px 11px;margin:0 0 14px;font-size:.84rem}
.online{background:rgba(65,170,113,.12);border:1px solid rgba(65,170,113,.28)}
.offline{background:rgba(225,166,54,.12);border:1px solid rgba(225,166,54,.35)}
.queue{background:rgba(72,134,200,.12);border:1px solid rgba(72,134,200,.32)}
.upload{display:grid;place-items:center;min-height:165px;border:2px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:20px;text-align:center;padding:22px;cursor:pointer;background:rgba(0,0,0,.12)}
.upload strong{font-size:1.2rem}.upload span{display:block;color:#9cacaa;margin-top:8px}
.upload input{display:none}
.compare{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.previewBox{min-width:0;background:#061012;border:1px solid rgba(255,255,255,.08);border-radius:17px;padding:7px}
.previewBox b{display:block;margin:2px 4px 7px;color:var(--accent);font-size:.78rem}
.previewBox img,.previewBox canvas{width:100%;height:auto;max-height:520px;object-fit:contain;border-radius:10px;display:block}
.consent{display:flex;gap:10px;align-items:flex-start;margin:17px 0;color:#c5cfcd;font-size:.9rem}
.consent input{margin-top:3px;transform:scale(1.2)}
button{width:100%;border:0;border-radius:15px;padding:16px;font:inherit;font-weight:900;background:var(--accent);color:#102020;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.msg{border-radius:14px;padding:13px 15px;margin:15px 0 0;display:none}
.ok{display:block;background:rgba(68,180,117,.16);border:1px solid rgba(68,180,117,.35)}
.warn{display:block;background:rgba(225,166,54,.13);border:1px solid rgba(225,166,54,.35)}
.err{display:block;background:rgba(220,80,80,.14);border:1px solid rgba(220,80,80,.35)}
.foot{text-align:center;color:#7f9692;font-size:.78rem;margin-top:18px}
.loading{padding:60px 20px;text-align:center;color:#a8b6b4}
@media(max-width:430px){.card{padding:14px}.compare{gap:5px}.previewBox{padding:4px}.previewBox b{font-size:.68rem}}
</style>
</head>
<body>
<main class="wrap"><section class="card" id="card"><div class="loading">Event wird geladen …</div></section></main>
<script src="./config.js"></script>
<script>
const cfg=window.FTS_CONFIG;
const params=new URLSearchParams(location.search);
const eventToken=params.get('e') || cfg.defaultEventToken;
const EVENT_CACHE_KEY='fts_event_cache_'+eventToken;
const DB_NAME='fts_selfie_offline_v1', STORE='queue';
let ev=null,selectedFile=null,designedBlob=null;

function apiHeaders(json=true){
  const h={'apikey':cfg.publishableKey,'Authorization':'Bearer '+cfg.publishableKey};
  if(json)h['Content-Type']='application/json';
  return h;
}
async function rpc(name,body){
  const r=await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${name}`,{method:'POST',headers:apiHeaders(true),body:JSON.stringify(body)});
  if(!r.ok)throw new Error((await r.text())||`RPC ${r.status}`);
  const t=await r.text(); return t?JSON.parse(t):null;
}
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function queuePut(item){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}
async function queueDelete(id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}
async function queueAll(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAll();
    req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);
  });
}
async function updateQueueCount(){
  try{
    const n=(await queueAll()).length;
    const el=document.getElementById('net');
    if(!el)return;
    if(n>0)el.innerHTML=`⏳ ${n} Foto${n===1?'':'s'} warten auf Upload · ${navigator.onLine?'Internet vorhanden – Upload läuft automatisch.':'Kein Internet – sicher auf diesem Handy gespeichert.'}`;
  }catch{}
}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/')}
async function uploadObject(path,blob,type){
  const u=`${cfg.supabaseUrl}/storage/v1/object/${encodeURIComponent(cfg.liveBucket)}/${encodePath(path)}`;
  const r=await fetch(u,{method:'POST',headers:{'apikey':cfg.publishableKey,'Authorization':'Bearer '+cfg.publishableKey,'Content-Type':type||'application/octet-stream','x-upsert':'false'},body:blob});
  if(!r.ok){
    const txt=await r.text();
    if(r.status===409 || /already exists/i.test(txt))return; // already uploaded by retry/background sync
    throw new Error(txt||`Storage ${r.status}`);
  }
}
async function registerPhoto(item){
  await rpc('fts_register_photo',{p_event_token:item.eventToken,p_original_path:item.originalPath,p_designed_path:item.designedPath});
}
async function uploadItem(item){
  await uploadObject(item.originalPath,item.originalBlob,item.originalType);
  await uploadObject(item.designedPath,item.designedBlob,'image/jpeg');
  await registerPhoto(item);
}
async function processQueue(){
  if(!navigator.onLine)return updateNet();
  const items=await queueAll();
  for(const item of items){
    try{await uploadItem(item);await queueDelete(item.id)}
    catch(e){console.warn('Queue upload',e);break}
  }
  updateNet();updateQueueCount();
}
function updateNet(){
  const el=document.getElementById('net'); if(!el)return;
  el.className='net '+(navigator.onLine?'online':'offline');
  el.textContent=navigator.onLine?'● Internet vorhanden':'● Offline – Fotos werden auf diesem Handy zwischengespeichert';
}
async function boot(){
  let data=null;
  try{
    if(navigator.onLine){
      data=await rpc('fts_get_event',{p_event_token:eventToken});
      if(data?.length)localStorage.setItem(EVENT_CACHE_KEY,JSON.stringify(data[0]));
    }
  }catch(e){console.warn('Event online load',e)}
  if(data?.length)ev=data[0];
  else{
    try{ev=JSON.parse(localStorage.getItem(EVENT_CACHE_KEY)||'null')}catch{}
  }
  if(!ev){
    document.getElementById('card').innerHTML='<div class="loading"><h2>Dieses Event wurde auf diesem Handy noch nicht geladen.</h2><p>Für den ersten Aufruf ist einmal Internet erforderlich. Danach funktioniert die Selfie-Seite auch bei Netzausfall.</p></div>';
    return;
  }
  render();
  processQueue();
}
function render(){
  document.documentElement.style.setProperty('--accent',ev.accent||'#d9b56d');
  document.documentElement.style.setProperty('--bg1',ev.bg1||'#071315');
  document.documentElement.style.setProperty('--bg2',ev.bg2||'#10383a');
  document.getElementById('card').innerHTML=`
    <div class="brand">FTS.LU · SELFIE EVENT</div>
    <h1>${esc(ev.title)}</h1><div class="sub">${esc(ev.subtitle||'')}</div>
    <div class="meta">${esc(ev.location||'')} ${ev.event_date?'· '+new Date(ev.event_date+'T12:00:00').toLocaleDateString('de-DE'):''}</div>
    <div id="net" class="net"></div>
    <label class="upload"><div><strong>📸 Selfie aufnehmen</strong><span>oder ein Foto vom Handy auswählen</span></div><input id="photo" type="file" accept="image/*" capture="user"></label>
    <section class="compare" id="compare">
      <div class="previewBox"><b>Original</b><img id="originalPreview"></div>
      <div class="previewBox"><b>Event-Design</b><canvas id="designCanvas"></canvas></div>
    </section>
    <label class="consent"><input id="consent" type="checkbox"><span>Ich stimme zu, dass dieses Foto für die Veranstaltung an FTS übermittelt und gespeichert wird.</span></label>
    <button id="uploadBtn">Original + Design senden</button>
    <div id="message" class="msg"></div>
    <div class="foot">FTS.lu · Eventfotografie</div>`;
  updateNet();updateQueueCount();
  document.getElementById('photo').addEventListener('change',onPhoto);
  document.getElementById('uploadBtn').addEventListener('click',submitPhoto);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showMessage(text,kind='err'){const x=document.getElementById('message');x.textContent=text;x.className='msg '+kind}
function loadImage(file){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=URL.createObjectURL(file)})}
function roundRect(c,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+rr,y);c.arcTo(x+w,y,x+w,y+h,rr);c.arcTo(x+w,y+h,x,y+h,rr);c.arcTo(x,y+h,x,y,rr);c.arcTo(x,y,x+w,y,rr);c.closePath()}
async function onPhoto(){
  const file=document.getElementById('photo').files?.[0]; if(!file)return;
  selectedFile=file;document.getElementById('originalPreview').src=URL.createObjectURL(file);
  await makeDesign(file);document.getElementById('compare').style.display='grid';document.getElementById('message').className='msg';
}
async function makeDesign(file){
  const img=await loadImage(file),canvas=document.getElementById('designCanvas'),ctx=canvas.getContext('2d');
  const scale=Math.min(1,1800/img.naturalWidth);canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const top=ctx.createLinearGradient(0,0,0,canvas.height*.28);top.addColorStop(0,'rgba(0,0,0,.40)');top.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=top;ctx.fillRect(0,0,canvas.width,canvas.height*.32);
  const bottom=ctx.createLinearGradient(0,canvas.height*.52,0,canvas.height);bottom.addColorStop(0,'rgba(3,14,15,0)');bottom.addColorStop(.34,'rgba(3,14,15,.62)');bottom.addColorStop(1,'rgba(3,14,15,.96)');ctx.fillStyle=bottom;ctx.fillRect(0,canvas.height*.52,canvas.width,canvas.height*.48);
  const pad=Math.max(24,canvas.width*.045),badgeH=Math.max(42,canvas.width*.05),badgeW=Math.max(220,canvas.width*.29);
  ctx.fillStyle='rgba(5,18,19,.82)';roundRect(ctx,pad,pad,badgeW,badgeH,badgeH/2);ctx.fill();
  ctx.fillStyle=ev.accent;ctx.font=`800 ${Math.max(17,canvas.width*.019)}px system-ui`;ctx.textBaseline='middle';ctx.fillText('FTS.LU · SELFIE EVENT',pad+badgeH*.38,pad+badgeH/2);
  const y=canvas.height-pad*2.3;ctx.textBaseline='alphabetic';ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(38,canvas.width*.06)}px system-ui`;ctx.fillText(ev.title,pad,y-Math.max(45,canvas.width*.055));
  ctx.fillStyle=ev.accent;ctx.font=`800 ${Math.max(25,canvas.width*.035)}px system-ui`;ctx.fillText(ev.subtitle||'',pad,y);
  ctx.fillStyle='rgba(255,255,255,.88)';ctx.font=`600 ${Math.max(18,canvas.width*.024)}px system-ui`;ctx.fillText(ev.overlay_text||ev.title,pad,y+Math.max(30,canvas.width*.035));
  designedBlob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.9));
}
async function submitPhoto(){
  if(!selectedFile)return showMessage('Bitte zuerst ein Foto aufnehmen oder auswählen.');
  if(!document.getElementById('consent').checked)return showMessage('Bitte zuerst der Übermittlung zustimmen.');
  if(selectedFile.size>15*1024*1024)return showMessage('Das Original ist größer als 15 MB.');

  const btn=document.getElementById('uploadBtn');btn.disabled=true;
  const id=`${Date.now()}_${crypto.randomUUID()}`;
  const ext=(selectedFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const item={id,createdAt:Date.now(),eventToken:ev.event_token,originalPath:`${ev.event_token}/original/${id}.${ext}`,designedPath:`${ev.event_token}/designed/${id}.jpg`,originalBlob:selectedFile,designedBlob,originalType:selectedFile.type||'image/jpeg'};

  try{
    if(navigator.onLine){
      btn.textContent='Foto wird hochgeladen …';
      try{
        await uploadItem(item);
        showMessage('✓ Original und Event-Version erfolgreich hochgeladen. Danke!','ok');
      }catch(e){
        await queuePut(item);
        showMessage('✓ Foto sicher gespeichert. Der Upload wird automatisch fortgesetzt, sobald die Verbindung wieder funktioniert.','warn');
        registerBackgroundSync();
      }
    }else{
      btn.textContent='Foto wird offline gespeichert …';
      await queuePut(item);
      showMessage('✓ Foto sicher auf diesem Handy gespeichert. Sobald Internet wieder da ist, wird es automatisch hochgeladen.','warn');
      registerBackgroundSync();
    }
    selectedFile=null;designedBlob=null;document.getElementById('photo').value='';document.getElementById('consent').checked=false;
    await updateQueueCount();
  }catch(e){
    console.error(e);showMessage('Das Foto konnte nicht sicher gespeichert werden: '+(e?.message||'Fehler'),'err');
  }finally{
    btn.disabled=false;btn.textContent='Original + Design senden';
  }
}
async function registerBackgroundSync(){
  try{
    const reg=await navigator.serviceWorker.ready;
    if('sync' in reg)await reg.sync.register('fts-upload-queue');
  }catch(e){console.warn('Background Sync nicht verfügbar',e)}
}
window.addEventListener('online',()=>{updateNet();processQueue()});
window.addEventListener('offline',updateNet);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine)processQueue()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);
boot();
</script>
</body>
</html>
